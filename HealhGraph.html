
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedGraph — 医疗知识图谱管理系统</title>
<script src="https://d3js.org/d3.v7.min.js">
</script>
<style>
/* ============================================================
   CSS Custom Properties — Theme System
   ============================================================ */
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --fg: #111111;
  --muted: #6B6B6B;
  --border: #E5E5E5;
  --accent: #2F6FEB;
  --accent-light: #EBF1FD;
  --accent-dark: #1D50B7;
  --success: #17A34A;
  --warn: #EAB308;
  --danger: #DC2626;
  --danger-light: #FEF2F2;
  --success-light: #F0FDF4;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', monospace;
  --transition-theme: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

[data-theme="dark"] {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --fg: #e8e8e8;
  --muted: #999999;
  --border: #2a2a2a;
  --accent-light: #1a2a4a;
  --accent-dark: #6098F8;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --danger-light: #2a1015;
  --success-light: #0a1a10;
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  transition: var(--transition-theme);
  line-height: 1.5;
  overflow-x: hidden;
}

/* ============================================================
   Header Navigation
   ============================================================ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  transition: var(--transition-theme);
  box-shadow: var(--shadow-sm);
}

.header-brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--fg);
  flex-shrink: 0;
}

.header-brand .icon {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px;
}

.header-nav { display: flex; gap: 4px; }

.header-nav button {
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition-theme);
  white-space: nowrap;
}
.header-nav button:hover { background: var(--accent-light); color: var(--accent); }
.header-nav button.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }

.header-actions { display: flex; align-items: center; gap: 8px; }

.theme-toggle {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: var(--transition-theme);
  color: var(--fg);
}
.theme-toggle:hover { background: var(--accent-light); }

.color-swatches { display: flex; gap: 4px; }

.color-swatch {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.active { border-color: var(--fg); }

/* ============================================================
   Main Content Area
   ============================================================ */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  min-height: calc(100vh - 56px);
}

.view { display: none; }
.view.active { display: block; }

/* ============================================================
   Graph View (Home)
   ============================================================ */
.graph-container {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  height: calc(100vh - 140px);
  min-height: 500px;
  transition: var(--transition-theme);
  box-shadow: var(--shadow-sm);
}

.graph-container svg { width: 100%; height: 100%; }

.graph-search {
  position: absolute;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex; gap: 8px; align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 6px 6px 6px 16px;
  box-shadow: var(--shadow-md);
  transition: var(--transition-theme);
  min-width: 340px;
}

.graph-search input {
  flex: 1;
  border: none; outline: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--fg);
  min-width: 180px;
}
.graph-search input::placeholder { color: var(--muted); }

.graph-search .search-btn {
  padding: 8px 14px;
  border: none;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-body);
  white-space: nowrap;
}
.graph-search .search-btn:hover { background: var(--accent-dark); }

.graph-search .search-clear {
  padding: 6px 10px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  border-radius: var(--radius-sm);
}
.graph-search .search-clear:hover { color: var(--fg); }

.graph-legend {
  position: absolute;
  bottom: 16px; left: 16px;
  display: flex; flex-wrap: wrap; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition-theme);
  font-size: 12px;
}

.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.graph-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  box-shadow: var(--shadow-md);
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 20;
  max-width: 260px;
  color: var(--fg);
}
.graph-tooltip.visible { opacity: 1; }
.graph-tooltip .tt-name { font-weight: 600; margin-bottom: 4px; }
.graph-tooltip .tt-type { color: var(--muted); font-size: 11px; }
.graph-tooltip .tt-desc { margin-top: 4px; font-size: 12px; color: var(--muted); }

.node-detail-popup {
  position: absolute;
  top: 80px; right: 16px;
  width: 300px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 20px;
  z-index: 15;
  transition: var(--transition-theme);
  max-height: calc(100% - 120px);
  overflow-y: auto;
}

.node-detail-popup h3 {
  font-family: var(--font-display);
  font-size: 18px;
  margin-bottom: 4px;
}

.node-detail-popup .popup-type {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: var(--accent-light);
  color: var(--accent);
  margin-bottom: 10px;
}

.node-detail-popup .popup-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.node-detail-popup .popup-relations { font-size: 13px; }

.node-detail-popup .popup-relations li {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}

.popup-close {
  position: absolute;
  top: 12px; right: 12px;
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--muted);
}

/* ============================================================
   Split Layout (Node Management & Config Management)
   ============================================================ */
.split-layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  height: calc(100vh - 140px);
  min-height: 500px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: var(--transition-theme);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}

.panel-header h2 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}

.panel-header .btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--accent);
  cursor: pointer;
  font-weight: 500;
  font-family: var(--font-body);
  transition: var(--transition-theme);
}
.panel-header .btn-sm:hover { background: var(--accent-light); }

.panel-toolbar {
  padding: 10px 16px;
  display: flex; gap: 6px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-toolbar select,
.panel-toolbar input {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  transition: var(--transition-theme);
  min-width: 0;
}
.panel-toolbar select:focus,
.panel-toolbar input:focus {
  outline: none;
  border-color: var(--accent);
}
.panel-toolbar input { flex: 1; }

.panel-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.list-item {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s ease;
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.list-item:hover { background: var(--accent-light); }
.list-item.active { background: var(--accent-light); border-color: var(--accent); }

.list-item .item-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.list-item .item-meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }

.list-item .item-type-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  background: var(--accent-light);
  color: var(--accent);
}

.panel-detail {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%;
  color: var(--muted);
  text-align: center;
  gap: 8px;
  padding: 48px 24px;
}
.empty-state .empty-icon { font-size: 48px; opacity: 0.4; }

/* ============================================================
   Config Management — category sidebar + detail
   ============================================================ */
.config-categories {
  padding: 12px 8px;
  display: flex; flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}

.config-category-item {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s ease;
  color: var(--fg);
  display: flex; align-items: center; gap: 10px;
}
.config-category-item:hover { background: var(--accent-light); }
.config-category-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }

.config-category-item .cat-icon { font-size: 18px; width: 24px; text-align: center; }

.config-detail-header {
  padding: 0 20px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.config-detail-header h3 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}

.config-detail-header .type-count {
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
}

.type-list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  transition: var(--transition-theme);
  background: var(--bg);
}

.type-list-item:hover { border-color: var(--accent); background: var(--surface); }

.type-list-item .type-color-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
}

.type-list-item .type-label {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  min-width: 0;
}

.type-list-item .type-usage {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  background: var(--surface);
  padding: 3px 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.type-list-item button {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-body);
  color: var(--fg);
  transition: var(--transition-theme);
  white-space: nowrap;
}
.type-list-item button:hover { background: var(--accent-light); color: var(--accent); }
.type-list-item button.btn-delete-type:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }

/* Inline edit for types */
.inline-edit-row {
  display: flex; gap: 8px; align-items: center;
  padding: 4px 0;
}

.inline-edit-row input {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--fg);
}
.inline-edit-row input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-light); }

.inline-edit-row .btn-confirm {
  padding: 9px 16px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}
.inline-edit-row .btn-cancel {
  padding: 9px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
}

.add-type-row {
  margin-top: 10px;
  padding: 12px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  transition: var(--transition-theme);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.add-type-row:hover { background: var(--accent-light); border-color: var(--accent); }

/* ============================================================
   Form (Node Detail)
   ============================================================ */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  transition: var(--transition-theme);
  resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.form-group textarea { min-height: 70px; }

.form-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
}
.btn-secondary:hover { background: var(--accent-light); }

.btn-danger {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
}
.btn-danger:hover { background: var(--danger-light); }

.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }

/* Mini Graph */
.mini-graph-container {
  width: 100%;
  height: 220px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-top: 8px;
  background: var(--bg);
  overflow: hidden;
  transition: var(--transition-theme);
}

/* Relation multi-select */
.relation-row {
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: var(--transition-theme);
}
.relation-row select { flex: 1; min-width: 0; }
.relation-row .btn-remove-rel {
  background: none; border: none;
  color: var(--danger); cursor: pointer;
  font-size: 18px; padding: 4px;
}

/* Toast */
.toast-container {
  position: fixed;
  top: 72px; right: 24px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}

.toast {
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  animation: slideIn 0.3s ease;
  max-width: 360px;
  color: #fff;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--accent); }

@keyframes slideIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 1023px) {
  .split-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: 16px;
    height: auto;
    min-height: auto;
  }
  .panel { max-height: 400px; }
  .graph-search { min-width: 260px; left: 12px; transform: none; }
  .node-detail-popup { width: 260px; right: 8px; top: 70px; }
}

@media (max-width: 639px) {
  .header { padding: 0 8px; height: 48px; }
  .header-brand { font-size: 14px; gap: 6px; }
  .header-brand .icon { width: 26px; height: 26px; font-size: 13px; }
  .header-nav button { padding: 5px 8px; font-size: 11px; }
  .main { padding: 12px; }
  .split-layout { gap: 12px; }
  .graph-container { height: calc(100vh - 200px); min-height: 360px; }
  .graph-search {
    min-width: auto; left: 8px; right: 8px; top: 8px;
    padding: 6px 6px 6px 12px;
    border-radius: var(--radius-sm);
  }
  .graph-search input { min-width: 100px; font-size: 13px; }
  .graph-legend { bottom: 8px; left: 8px; gap: 8px; padding: 6px 10px; font-size: 10px; }
  .node-detail-popup { width: auto; left: 8px; right: 8px; top: 56px; }
  .panel-toolbar { flex-direction: column; }
  .color-swatches { display: none; }
  .config-detail-header { padding: 0 12px 12px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <div class="icon">◇</div>
    <span>MedGraph</span>
  </div>
  <nav class="header-nav" id="headerNav">
    <button data-view="graph" class="active">知识图谱</button>
    <button data-view="nodes">节点管理</button>
    <button data-view="config">配置管理</button>
  </nav>
  <div class="header-actions">
    <div class="color-swatches" id="colorSwatches"></div>
    <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">◐</button>
  </div>
</header>

<!-- Main Content -->
<main class="main" id="mainContent">

  <!-- Graph View -->
  <div class="view active" id="view-graph">
    <div class="graph-container" id="graphContainer">
      <div class="graph-search" id="graphSearch">
        <input type="text" id="graphSearchInput" placeholder="搜索节点名称、类型…" autocomplete="off">
        <button class="search-clear" id="graphSearchClear" title="清除">✕</button>
        <button class="search-btn" id="graphSearchBtn">搜索</button>
      </div>
      <div class="graph-legend" id="graphLegend"></div>
      <div class="graph-tooltip" id="graphTooltip"></div>
      <div class="node-detail-popup" id="nodeDetailPopup" style="display:none;">
        <button class="popup-close" id="popupClose">✕</button>
        <div id="popupContent"></div>
      </div>

/* ============================================================
   State Management
   ============================================================ */
const STORAGE_KEY_NODES = 'medgraph_nodes_v2';
const STORAGE_KEY_RELATIONS = 'medgraph_relations_v2';
const STORAGE_KEY_THEME = 'medgraph_theme';
const STORAGE_KEY_ACCENT = 'medgraph_accent';
const STORAGE_KEY_NODE_TYPES = 'medgraph_nodeTypes_v2';
const STORAGE_KEY_RELATION_TYPES = 'medgraph_relationTypes_v2';

const ACCENT_COLORS = ['#2F6FEB', '#DC2626', '#7C3AED', '#059669', '#D97706', '#DB2777', '#0891B2', '#4F46E5'];

let state = {
  nodes: [],
  relations: [],
  nodeTypes: [],
  relationTypes: [],
  theme: 'light',
  accent: '#2F6FEB',
  currentView: 'graph',
  configCategory: 'relationTypes',
  selectedNodeId: null,
  searchTerm: '',
};

function loadData() {
  const storedNodes = localStorage.getItem(STORAGE_KEY_NODES);
  state.nodes = storedNodes ? JSON.parse(storedNodes) : JSON.parse(JSON.stringify(DEMO_NODES));
  if (!storedNodes) saveNodes();

  const storedRelations = localStorage.getItem(STORAGE_KEY_RELATIONS);
  state.relations = storedRelations ? JSON.parse(storedRelations) : JSON.parse(JSON.stringify(DEMO_RELATIONS));
  if (!storedRelations) saveRelations();

  const storedNodeTypes = localStorage.getItem(STORAGE_KEY_NODE_TYPES);
  state.nodeTypes = storedNodeTypes ? JSON.parse(storedNodeTypes) : [...DEFAULT_NODE_TYPES];
  if (!storedNodeTypes) saveNodeTypes();

  const storedRelationTypes = localStorage.getItem(STORAGE_KEY_RELATION_TYPES);
  state.relationTypes = storedRelationTypes ? JSON.parse(storedRelationTypes) : [...DEFAULT_RELATION_TYPES];
  if (!storedRelationTypes) saveRelationTypes();
}

function saveNodes() { localStorage.setItem(STORAGE_KEY_NODES, JSON.stringify(state.nodes)); }
function saveRelations() { localStorage.setItem(STORAGE_KEY_RELATIONS, JSON.stringify(state.relations)); }
function saveNodeTypes() { localStorage.setItem(STORAGE_KEY_NODE_TYPES, JSON.stringify(state.nodeTypes)); }
function saveRelationTypes() { localStorage.setItem(STORAGE_KEY_RELATION_TYPES, JSON.stringify(state.relationTypes)); }

function loadTheme() {
  const saved = localStorage.getItem(STORAGE_KEY_THEME);
  if (saved) state.theme = saved;
  const savedAccent = localStorage.getItem(STORAGE_KEY_ACCENT);
  if (savedAccent) state.accent = savedAccent;
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.style.setProperty('--accent-light', state.accent + '22');
  const darkAccent = adjustColor(state.accent, -15);
  document.documentElement.style.setProperty('--accent-dark', darkAccent);
  localStorage.setItem(STORAGE_KEY_THEME, state.theme);
  localStorage.setItem(STORAGE_KEY_ACCENT, state.accent);
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.min(255, Math.max(0, (num >> 16) + amount));
  let g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
  let b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
  return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function generateId(prefix) { return prefix + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function getNodeById(id) { return state.nodes.find(n => n.id === id); }
function getRelationsForNode(nodeId) { return state.relations.filter(r => r.source === nodeId || r.target === nodeId); }

function getActiveNodeTypes() {
  const used = new Set(state.nodes.map(n => n.type));
  return [...new Set([...state.nodeTypes, ...used])];
}
function getActiveRelationTypes() {
  const used = new Set(state.relations.map(r => r.type));
  return [...new Set([...state.relationTypes, ...used])];
}
function getNodeTypeUsageCount(type) { return state.nodes.filter(n => n.type === type).length; }
function getRelationTypeUsageCount(type) { return state.relations.filter(r => r.type === type).length; }

/* ============================================================
   Toast
   ============================================================ */
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2800);
}

/* ============================================================
   Theme Controls
   ============================================================ */
function initThemeControls() {
  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    applyTheme();
    if (state.currentView === 'graph') renderGraph();
    showToast(state.theme === 'dark' ? '已切换为深色模式' : '已切换为浅色模式', 'info');
  });

  const swatchesContainer = document.getElementById('colorSwatches');
  ACCENT_COLORS.forEach(color => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (color === state.accent ? ' active' : '');
    swatch.style.backgroundColor = color;
    swatch.addEventListener('click', () => {
      state.accent = color;
      applyTheme();
      if (state.currentView === 'graph') renderGraph();
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      showToast('主题色已更新', 'info');
    });
    swatchesContainer.appendChild(swatch);
  });
}

/* ============================================================
   Navigation
   ============================================================ */
function initNavigation() {
  document.getElementById('headerNav').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const viewName = btn.dataset.view;
    if (viewName === state.currentView) return;

    document.querySelectorAll('.header-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewName).classList.add('active');
    state.currentView = viewName;
    state.selectedNodeId = null;
    state.searchTerm = '';

    if (viewName === 'graph') {
      document.getElementById('graphSearchInput').value = '';
      document.getElementById('nodeDetailPopup').style.display = 'none';
      renderGraph();
    } else if (viewName === 'nodes') {
      renderNodeManagement();
    } else if (viewName === 'config') {
      renderConfigManagement();
    }
  });
}

/* ============================================================
   Config Management (independent top-level view)
   ============================================================ */
function initConfigCategories() {
  document.getElementById('configCategories').addEventListener('click', (e) => {
    const item = e.target.closest('.config-category-item');
    if (!item) return;
    state.configCategory = item.dataset.config;
    document.querySelectorAll('.config-category-item').forEach(c => c.classList.remove('active'));
    item.classList.add('active');
    renderConfigDetail();
  });
}

function renderConfigManagement() {
  document.querySelectorAll('.config-category-item').forEach(item => {
    item.classList.toggle('active', item.dataset.config === state.configCategory);
  });
  renderConfigDetail();
}

function renderConfigDetail() {
  const header = document.getElementById('configDetailHeader');
  const container = document.getElementById('configDetail');

  if (state.configCategory === 'relationTypes') {
    header.innerHTML = `<h3>关系类型 <span class="type-count">（${state.relationTypes.length} 个类型）</span></h3>`;
    renderTypeList(container, 'relationTypes', state.relationTypes, getRelationTypeUsageCount, false);
  } else {
    header.innerHTML = `<h3>节点类型 <span class="type-count">（${state.nodeTypes.length} 个类型）</span></h3>`;
    renderTypeList(container, 'nodeTypes', state.nodeTypes, getNodeTypeUsageCount, true);
  }
}

function renderTypeList(container, categoryKey, types, usageFn, showColor) {
  let html = '';

  types.forEach((type, idx) => {
    const usage = usageFn(type);
    const color = showColor ? getTypeColor(type) : 'var(--accent)';
    html += `
      <div class="type-list-item" data-type="${escapeAttr(type)}" data-idx="${idx}">
        <div class="type-color-dot" style="background:${color};min-width:16px;"></div>
        <span class="type-label">${escapeHtml(type)}</span>
        <span class="type-usage">${usage > 0 ? usage + ' 个使用中' : '未使用'}</span>
        <button class="btn-edit-type">编辑</button>
        <button class="btn-delete-type">删除</button>
      </div>`;
  });

  html += `<div class="add-type-row" id="addTypeRow">+ 新增类型</div>`;
  container.innerHTML = html;

  // Edit handler
  container.querySelectorAll('.btn-edit-type').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = btn.closest('.type-list-item');
      startInlineEdit(row, categoryKey);
    });
  });

  // Delete handler
  container.querySelectorAll('.btn-delete-type').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = btn.closest('.type-list-item');
      deleteType(row.dataset.type, categoryKey);
    });
  });

  // Add handler
  container.querySelector('#addTypeRow').addEventListener('click', () => {
    startInlineAdd(container, categoryKey);
  });
}

function startInlineEdit(row, categoryKey) {
  const typeName = row.dataset.type;
  const idx = parseInt(row.dataset.idx);
  row.innerHTML = `
    <div class="inline-edit-row" style="flex:1;">
      <input type="text" value="${escapeHtml(typeName)}" id="inlineEditInput" autofocus>
      <button class="btn-confirm" id="btnConfirmEdit">保存</button>
      <button class="btn-cancel" id="btnCancelEdit">取消</button>
    </div>`;

  const input = row.querySelector('#inlineEditInput');
  input.focus(); input.select();

  row.querySelector('#btnConfirmEdit').addEventListener('click', () => {
    const newName = input.value.trim();
    if (!newName) { showToast('名称不能为空', 'error'); return; }
    if (newName === typeName) { renderConfigDetail(); return; }

    const types = categoryKey === 'nodeTypes' ? state.nodeTypes : state.relationTypes;
    if (types.includes(newName)) { showToast('类型名称已存在', 'error'); return; }

    types[idx] = newName;

    if (categoryKey === 'nodeTypes') {
      state.nodes.forEach(n => { if (n.type === typeName) n.type = newName; });
      saveNodes(); saveNodeTypes();
    } else {
      state.relations.forEach(r => { if (r.type === typeName) r.type = newName; });
      saveRelations(); saveRelationTypes();
    }

    showToast('类型已更新', 'success');
    renderConfigDetail();
    if (state.currentView === 'nodes') renderNodeManagement();
    if (state.currentView === 'graph') renderGraph();
  });

  row.querySelector('#btnCancelEdit').addEventListener('click', () => renderConfigDetail());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') row.querySelector('#btnConfirmEdit').click();
    if (e.key === 'Escape') row.querySelector('#btnCancelEdit').click();
  });
}

function startInlineAdd(container, categoryKey) {
  const addRow = container.querySelector('#addTypeRow');
  const label = categoryKey === 'nodeTypes' ? '节点类型' : '关系类型';
  addRow.outerHTML = `
    <div class="inline-edit-row" id="inlineAddRow">
      <input type="text" placeholder="输入新${label}名称…" id="inlineAddInput" autofocus>
      <button class="btn-confirm" id="btnConfirmAdd">添加</button>
      <button class="btn-cancel" id="btnCancelAdd">取消</button>
    </div>`;

  const input = document.getElementById('inlineAddInput');
  input.focus();

  document.getElementById('btnConfirmAdd').addEventListener('click', () => {
    const newName = input.value.trim();
    if (!newName) { showToast('名称不能为空', 'error'); return; }

    const types = categoryKey === 'nodeTypes' ? state.nodeTypes : state.relationTypes;
    if (types.includes(newName)) { showToast('类型名称已存在', 'error'); return; }

    types.push(newName);
    if (categoryKey === 'nodeTypes') saveNodeTypes();
    else saveRelationTypes();

    showToast('类型已添加', 'success');
    renderConfigDetail();
    if (state.currentView === 'nodes') renderNodeManagement();
    if (state.currentView === 'graph') renderGraph();
  });

  document.getElementById('btnCancelAdd').addEventListener('click', () => renderConfigDetail());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnConfirmAdd').click();
    if (e.key === 'Escape') document.getElementById('btnCancelAdd').click();
  });
}

function deleteType(typeName, categoryKey) {
  const types = categoryKey === 'nodeTypes' ? state.nodeTypes : state.relationTypes;
  const usageCount = categoryKey === 'nodeTypes' ? getNodeTypeUsageCount(typeName) : getRelationTypeUsageCount(typeName);

  if (usageCount > 0) {
    const entity = categoryKey === 'nodeTypes' ? '节点' : '关系';
    if (!confirm(`类型「${typeName}」当前被 ${usageCount} 个${entity}使用。\n\n删除后这些${entity}的类型将保持不变，但该类型会从筛选器中移除。\n\n确定删除？`)) return;
  } else {
    if (!confirm(`确定删除类型「${typeName}」？`)) return;
  }

  const idx = types.indexOf(typeName);
  if (idx >= 0) types.splice(idx, 1);
  if (categoryKey === 'nodeTypes') saveNodeTypes();
  else saveRelationTypes();

  showToast('类型已删除', 'success');
  renderConfigDetail();
  if (state.currentView === 'nodes') renderNodeManagement();
  if (state.currentView === 'graph') renderGraph();
}

/* ============================================================
   D3 Force Graph
   ============================================================ */
let graphSimulation = null, graphSvg = null, graphG = null, graphZoom = null;

function renderGraph() {
  const container = document.getElementById('graphContainer');
  const width = container.clientWidth, height = container.clientHeight;

  d3.select('#graphContainer svg').remove();
  graphSvg = d3.select('#graphContainer').append('svg').attr('width', width).attr('height', height);
  graphG = graphSvg.append('g');

  graphZoom = d3.zoom().scaleExtent([0.15, 4]).on('zoom', (event) => { graphG.attr('transform', event.transform); });
  graphSvg.call(graphZoom);
  graphSvg.call(graphZoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.85));

  const searchTerm = state.searchTerm.trim().toLowerCase();
  let filteredNodes = state.nodes, filteredRelations = state.relations;
  let highlightedNodeIds = new Set();

  if (searchTerm) {
    highlightedNodeIds = new Set(state.nodes.filter(n =>
      n.name.toLowerCase().includes(searchTerm) || n.type.toLowerCase().includes(searchTerm) || n.description.toLowerCase().includes(searchTerm)
    ).map(n => n.id));
    const neighborIds = new Set();
    state.relations.forEach(r => {
      if (highlightedNodeIds.has(r.source)) neighborIds.add(r.target);
      if (highlightedNodeIds.has(r.target)) neighborIds.add(r.source);
    });
    highlightedNodeIds = new Set([...highlightedNodeIds, ...neighborIds]);
    filteredNodes = state.nodes.filter(n => highlightedNodeIds.has(n.id));
    filteredRelations = state.relations.filter(r => highlightedNodeIds.has(r.source) && highlightedNodeIds.has(r.target));
  }

  const links = filteredRelations.map(r => ({ source: r.source, target: r.target, type: r.type, id: r.id }));

  graphSimulation = d3.forceSimulation(filteredNodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-350))
    .force('center', d3.forceCenter(0, 0))
    .force('collide', d3.forceCollide(40));

  const link = graphG.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', 'var(--border)').attr('stroke-width', 1.5).attr('stroke-opacity', 0.7)
    .attr('stroke-dasharray', d => d.type === '并发症' ? '5,4' : null);

  const node = graphG.append('g').selectAll('g').data(filteredNodes).join('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) graphSimulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) graphSimulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => Math.min(12 + getRelationsForNode(d.id).length * 2, 28))
    .attr('fill', d => getTypeColor(d.type))
    .attr('stroke', 'var(--surface)').attr('stroke-width', 2.5)
    .attr('opacity', d => (searchTerm && highlightedNodeIds.has(d.id)) || !searchTerm ? 1 : 0.15)
    .style('transition', 'opacity 0.3s ease');

  node.append('text')
    .text(d => d.name.length > 8 ? d.name.slice(0, 7) + '…' : d.name)
    .attr('dy', 36).attr('text-anchor', 'middle')
    .attr('fill', 'var(--fg)').attr('font-size', '12px').attr('font-family', 'var(--font-body)').attr('font-weight', '500')
    .attr('opacity', d => (searchTerm && highlightedNodeIds.has(d.id)) || !searchTerm ? 1 : 0.15)
    .style('transition', 'opacity 0.3s ease').style('pointer-events', 'none');

  node.on('mouseenter', function(event, d) {
    if (searchTerm && !highlightedNodeIds.has(d.id)) return;
    const connectedIds = new Set();
    state.relations.forEach(r => { if (r.source === d.id) connectedIds.add(r.target); if (r.target === d.id) connectedIds.add(r.source); });
    connectedIds.add(d.id);
    graphG.selectAll('circle').attr('opacity', nd => connectedIds.has(nd.id) ? 1 : 0.2);
    graphG.selectAll('text').attr('opacity', nd => connectedIds.has(nd.id) ? 1 : 0.2);
    graphG.selectAll('line').attr('stroke-opacity', ld => (ld.source.id === d.id || ld.target.id === d.id) ? 1 : 0.1).attr('stroke-width', ld => (ld.source.id === d.id || ld.target.id === d.id) ? 2.5 : 1);
    const tooltip = document.getElementById('graphTooltip');
    tooltip.innerHTML = `<div class="tt-name">${d.name}</div><div class="tt-type">${d.type}</div><div class="tt-desc">${d.description.slice(0, 80)}…</div>`;
    tooltip.classList.add('visible');
  });

  node.on('mousemove', function(event) {
    const tooltip = document.getElementById('graphTooltip');
    const cr = container.getBoundingClientRect();
    tooltip.style.left = (event.clientX - cr.left + 16) + 'px';
    tooltip.style.top = (event.clientY - cr.top - 60) + 'px';
  });

  node.on('mouseleave', function() {
    if (!searchTerm) { graphG.selectAll('circle').attr('opacity', 1); graphG.selectAll('text').attr('opacity', 1); }
    else { graphG.selectAll('circle').attr('opacity', nd => highlightedNodeIds.has(nd.id) ? 1 : 0.15); graphG.selectAll('text').attr('opacity', nd => highlightedNodeIds.has(nd.id) ? 1 : 0.15); }
    graphG.selectAll('line').attr('stroke-opacity', 0.7).attr('stroke-width', 1.5);
    document.getElementById('graphTooltip').classList.remove('visible');
  });

  node.on('click', function(event, d) { event.stopPropagation(); state.selectedNodeId = d.id; showNodePopup(d); });
  graphSvg.on('click', function() { state.selectedNodeId = null; document.getElementById('nodeDetailPopup').style.display = 'none'; });
  graphSimulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  renderGraphLegend();
}

function renderGraphLegend() {
  document.getElementById('graphLegend').innerHTML = getActiveNodeTypes().map(type =>
    `<div class="legend-item"><div class="legend-dot" style="background:${getTypeColor(type)};"></div><span>${type}</span></div>`
  ).join('');
}

function showNodePopup(node) {
  const popup = document.getElementById('nodeDetailPopup');
  const content = document.getElementById('popupContent');
  const relations = getRelationsForNode(node.id);
  let relHtml = '<ul class="popup-relations">';
  relations.forEach(r => {
    const otherId = r.source === node.id ? r.target : r.source;
    const otherNode = getNodeById(otherId);
    if (otherNode) {
      relHtml += `<li><span style="color:var(--accent);font-weight:500">${r.type}</span> ${r.source === node.id ? '→' : '←'} ${otherNode.name} <span style="color:var(--muted);font-size:11px">(${otherNode.type})</span></li>`;
    }
  });
  relHtml += relations.length === 0 ? '<li style="color:var(--muted)">暂无关联关系</li>' : '</ul>';
  content.innerHTML = `<h3>${escapeHtml(node.name)}</h3><div class="popup-type">${escapeHtml(node.type)}</div><div class="popup-desc">${escapeHtml(node.description)}</div><div style="font-weight:600;font-size:13px;margin-bottom:6px;">关联关系 (${relations.length})</div>${relHtml}`;
  popup.style.display = 'block';
}

document.getElementById('popupClose').addEventListener('click', () => {
  document.getElementById('nodeDetailPopup').style.display = 'none';
  state.selectedNodeId = null;
});

   Graph Search
   ============================================================ */
function initGraphSearch() {
  const input = document.getElementById('graphSearchInput');
  const doSearch = () => { state.searchTerm = input.value.trim(); renderGraph(); };
  document.getElementById('graphSearchBtn').addEventListener('click', doSearch);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  document.getElementById('graphSearchClear').addEventListener('click', () => { input.value = ''; state.searchTerm = ''; renderGraph(); });

/* ============================================================
   Node Management
   ============================================================ */
let editingNodeId = null;

function renderNodeManagement() {
  renderNodeTypeFilter();
  renderNodeList();
}

function renderNodeTypeFilter() {
  const filter = document.getElementById('nodeTypeFilter');
  filter.innerHTML = '<option value="">全部类型</option>' +
    getActiveNodeTypes().map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
}

function renderNodeList() {
  const filterType = document.getElementById('nodeTypeFilter').value;
  const sortBy = document.getElementById('nodeSortBy').value;
  const searchTerm = document.getElementById('nodeSearchInput').value.trim().toLowerCase();

  let nodes = [...state.nodes];
  if (filterType) nodes = nodes.filter(n => n.type === filterType);
  if (searchTerm) nodes = nodes.filter(n => n.name.toLowerCase().includes(searchTerm) || n.type.includes(searchTerm) || n.description.toLowerCase().includes(searchTerm));

  nodes.sort((a, b) => {
    if (sortBy === 'name') return a.name.localeCompare(b.name, 'zh');
    if (sortBy === 'createdAt') return b.createdAt.localeCompare(a.createdAt);
    if (sortBy === 'type') return a.type.localeCompare(b.type, 'zh');
    return 0;
  });

  const list = document.getElementById('nodeList');
  list.innerHTML = nodes.map(n => `
    <div class="list-item ${state.selectedNodeId === n.id ? 'active' : ''}" data-node-id="${n.id}">
      <div class="item-name">${escapeHtml(n.name)}</div>
      <div class="item-meta">
        <span class="item-type-badge">${escapeHtml(n.type)}</span>
        <span>${getRelationsForNode(n.id).length} 个关联</span>
        <span>${n.createdAt}</span>
      </div>
    </div>`).join('');

  list.querySelectorAll('.list-item').forEach(item => {
    item.addEventListener('click', () => {
      state.selectedNodeId = item.dataset.nodeId;
      renderNodeList();
      showNodeDetail(state.selectedNodeId);
    });
  });
}

function showNodeDetail(nodeId) {
  const node = getNodeById(nodeId);
  if (!node) return;
  editingNodeId = nodeId;
  const relations = getRelationsForNode(nodeId);
  const otherNodes = state.nodes.filter(n => n.id !== nodeId);
  const activeNodeTypes = getActiveNodeTypes();
  const activeRelationTypes = getActiveRelationTypes();

  document.getElementById('nodeDetailContent').innerHTML = `
    <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:16px;">编辑节点</h3>
    <div class="form-group"><label>节点名称</label><input type="text" id="editNodeName" value="${escapeHtml(node.name)}"></div>
    <div class="form-group"><label>节点类型</label>
      <select id="editNodeType">${activeNodeTypes.map(t => `<option value="${escapeAttr(t)}" ${node.type===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}${!activeNodeTypes.includes(node.type)?`<option value="${escapeAttr(node.type)}" selected>${escapeHtml(node.type)} (旧)</option>`:''}</select>
    </div>
    <div class="form-group"><label>描述</label><textarea id="editNodeDesc">${escapeHtml(node.description)}</textarea></div>
    <div class="form-group"><label>关联关系配置 (一对多)</label>
      <div id="nodeRelationsEditor">${relations.map(r => {
        const otherId = r.source===nodeId ? r.target : r.source;
        const otherNode = getNodeById(otherId);
        return `<div class="relation-row" data-rel-id="${r.id}">
          <span style="font-size:12px;white-space:nowrap;color:var(--muted);min-width:50px;">${r.source===nodeId?'→ 关联至':'← 被关联'}</span>
          <select class="rel-target-select" style="flex:1;">${otherNodes.map(on => `<option value="${on.id}" ${on.id===otherId?'selected':''}>${escapeHtml(on.name)} (${escapeHtml(on.type)})</option>`).join('')}</select>
          <select class="rel-type-select" style="width:120px;">${activeRelationTypes.map(rt => `<option value="${escapeAttr(rt)}" ${r.type===rt?'selected':''}>${escapeHtml(rt)}</option>`).join('')}${!activeRelationTypes.includes(r.type)?`<option value="${escapeAttr(r.type)}" selected>${escapeHtml(r.type)}</option>`:''}</select>
          <button class="btn-remove-rel" title="移除">✕</button></div>`;
      }).join('')}</div>
      <button class="btn btn-secondary btn-sm" id="btnAddRelationRow" style="margin-top:8px;">+ 添加关联</button>
    </div>
    <div class="form-group"><label>关联图谱预览</label><div class="mini-graph-container" id="miniGraphContainer"></div></div>
    <div class="form-actions">
      <button class="btn btn-primary" id="btnSaveNode">保存</button>
      <button class="btn btn-secondary" id="btnCancelNode">取消</button>
      <button class="btn btn-danger" id="btnDeleteNode" style="margin-left:auto;">删除节点</button>
    </div>`;

  document.getElementById('btnSaveNode').addEventListener('click', () => saveNodeEdit(nodeId));
  document.getElementById('btnCancelNode').addEventListener('click', () => { editingNodeId=null; state.selectedNodeId=null; document.getElementById('nodeDetailContent').innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><p>选择一个节点查看详情</p></div>`; renderNodeList(); });
  document.getElementById('btnDeleteNode').addEventListener('click', () => deleteNode(nodeId));
  document.getElementById('btnAddRelationRow').addEventListener('click', () => addRelationRow(nodeId));
  renderMiniGraph(nodeId);
}

function saveNodeEdit(nodeId) {
  const node = getNodeById(nodeId); if (!node) return;
  const newName = document.getElementById('editNodeName').value.trim();
  if (!newName) { showToast('节点名称不能为空','error'); return; }
  node.name = newName;
  node.type = document.getElementById('editNodeType').value;
  node.description = document.getElementById('editNodeDesc').value.trim();

  const existingRelIds = new Set();
  document.querySelectorAll('#nodeRelationsEditor .relation-row').forEach(row => {
    const relId = row.dataset.relId;
    const targetSelect = row.querySelector('.rel-target-select');
    const typeSelect = row.querySelector('.rel-type-select');
    if (relId && relId !== 'new') {
      const rel = state.relations.find(r => r.id === relId);
      if (rel) { if (rel.source===nodeId) rel.target=targetSelect.value; else rel.source=targetSelect.value; rel.type=typeSelect.value; existingRelIds.add(relId); }
    } else {
      state.relations.push({ id: generateId('r'), source: nodeId, target: targetSelect.value, type: typeSelect.value, description: '' });
    }
  });

  getRelationsForNode(nodeId).forEach(r => { if (!existingRelIds.has(r.id)) state.relations = state.relations.filter(rr => rr.id !== r.id); });
  saveNodes(); saveRelations();
  showToast('节点已保存','success');
  renderNodeList(); showNodeDetail(nodeId);
  if (state.currentView==='graph') renderGraph();
}

function deleteNode(nodeId) {
  if (!confirm('确定要删除此节点吗？所有关联关系也将被删除。')) return;
  state.nodes = state.nodes.filter(n => n.id !== nodeId);
  state.relations = state.relations.filter(r => r.source !== nodeId && r.target !== nodeId);
  saveNodes(); saveRelations();
  state.selectedNodeId=null; editingNodeId=null;
  document.getElementById('nodeDetailContent').innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><p>选择一个节点查看详情</p></div>`;
  renderNodeList(); if (state.currentView==='graph') renderGraph();
  showToast('节点已删除','success');
}

function addRelationRow(nodeId) {
  const editor = document.getElementById('nodeRelationsEditor');
  const otherNodes = state.nodes.filter(n => n.id !== nodeId);
  if (!otherNodes.length) { showToast('没有可关联的节点','error'); return; }
  const row = document.createElement('div');
  row.className='relation-row'; row.dataset.relId='new';
  row.innerHTML=`<span style="font-size:12px;white-space:nowrap;color:var(--muted);min-width:50px;">→ 关联至</span>
    <select class="rel-target-select" style="flex:1;">${otherNodes.map(on => `<option value="${on.id}">${escapeHtml(on.name)} (${escapeHtml(on.type)})</option>`).join('')}</select>
    <select class="rel-type-select" style="width:120px;">${getActiveRelationTypes().map(rt => `<option value="${escapeAttr(rt)}">${escapeHtml(rt)}</option>`).join('')}</select>
    <button class="btn-remove-rel" title="移除">✕</button>`;
  row.querySelector('.btn-remove-rel').addEventListener('click', () => row.remove());
  editor.appendChild(row);
}

function renderMiniGraph(nodeId) {
  const container = document.getElementById('miniGraphContainer'); if (!container) return;
  const node = getNodeById(nodeId); if (!node) return;
  const relations = getRelationsForNode(nodeId);
  const neighborIds = new Set(); relations.forEach(r => { if (r.source===nodeId) neighborIds.add(r.target); else neighborIds.add(r.source); });
  const subNodes = [node, ...state.nodes.filter(n => neighborIds.has(n.id))];
  const subLinks = relations.map(r => ({ source: r.source, target: r.target, type: r.type }));
  container.innerHTML=''; const w=container.clientWidth, h=container.clientHeight;
  const svg = d3.select(container).append('svg').attr('width',w).attr('height',h);
  const g = svg.append('g');
  const sim = d3.forceSimulation(subNodes).force('link',d3.forceLink(subLinks).id(d=>d.id).distance(80)).force('charge',d3.forceManyBody().strength(-200)).force('center',d3.forceCenter(w/2,h/2)).force('collide',d3.forceCollide(22));
  g.selectAll('line').data(subLinks).join('line').attr('stroke','var(--border)').attr('stroke-width',1.2);
  const gn = g.selectAll('g').data(subNodes).join('g');
  gn.append('circle').attr('r',d=>d.id===nodeId?16:10).attr('fill',d=>getTypeColor(d.type)).attr('stroke','var(--surface)').attr('stroke-width',2);
  gn.append('text').text(d=>d.name.length>6?d.name.slice(0,5)+'…':d.name).attr('dy',d=>d.id===nodeId?28:20).attr('text-anchor','middle').attr('fill','var(--fg)').attr('font-size','10px').style('pointer-events','none');
  sim.on('tick',()=>{gn.attr('transform',d=>`translate(${d.x},${d.y})`);});
}

function initNodeManagement() {
  document.getElementById('nodeTypeFilter').addEventListener('change',renderNodeList);
  document.getElementById('nodeSortBy').addEventListener('change',renderNodeList);
  document.getElementById('nodeSearchInput').addEventListener('input',renderNodeList);
  document.getElementById('btnAddNode').addEventListener('click', ()=>{
    const newNode={id:generateId('n'),name:'新节点',type:state.nodeTypes[0]||'疾病',description:'',createdAt:new Date().toISOString().slice(0,10)};
    state.nodes.push(newNode); saveNodes();
    state.selectedNodeId=newNode.id; renderNodeList(); showNodeDetail(newNode.id);
    showToast('新节点已创建','success');
  });
}

/* ============================================================
   Utils
   ============================================================ */
function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str) { return str.replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   Init
   ============================================================ */
function init() {
  loadData(); loadTheme();
  initThemeControls();
  initNavigation();
  initConfigCategories();
  initGraphSearch();
  initNodeManagement();
  renderGraph();

  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (state.currentView === 'graph') renderGraph();
      else if (state.currentView === 'nodes' && state.selectedNodeId) renderMiniGraph(state.selectedNodeId);
    }, 300);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
