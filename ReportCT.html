/* ============================================================
   data / evaluation helpers
   ============================================================ */
function makeField(type, overrides = {}) {
  const n = uid('f');
  const labelMap = {
    radio: '新单选字段', select: '新下拉字段', checkboxGroup: '新多选字段', number: '新数值字段',
    text: '新文本字段', textarea: '新多行字段', scoreRadio: '新评分字段', matrix: '新分级矩阵',
    logicStage: '自动推导分期', scoreTotal: '分级总分', category: '评估分级', sectionTitle: '分组标题'
  };
  const varMap = {
    radio: 'field_' + n, select: 'field_' + n, checkboxGroup: 'field_' + n, number: 'field_' + n,
    text: 'field_' + n, textarea: 'field_' + n, scoreRadio: 'field_' + n, matrix: 'field_' + n,
    logicStage: 'stage', scoreTotal: 'score_total', category: 'category', sectionTitle: 'section_title'
  };
  const base = {
    id: uid('f'), type, label: labelMap[type], variable: varMap[type],
    required: false, default: null, condition: null,
    report: { finding: '', includeInFinding: true }
  };
  switch (type) {
    case 'radio':
    case 'select':
      base.options = [
        { id: uid('o'), value: 'option_a', label: '选项 A' },
        { id: uid('o'), value: 'option_b', label: '选项 B' }
      ];
      break;
    case 'checkboxGroup':
      base.default = [];
      base.options = [
        { id: uid('o'), value: 'item_a', label: '项目 A' },
        { id: uid('o'), value: 'item_b', label: '项目 B' }
      ];
      break;
    case 'number':
      base.unit = ''; base.min = 0; base.max = 100; base.default = 0;
      break;
    case 'scoreRadio':
      base.scoring = true;
      base.options = [
        { id: uid('o'), value: '低', label: '低', points: 1 },
        { id: uid('o'), value: '中', label: '中', points: 2 },
        { id: uid('o'), value: '高', label: '高', points: 3 }
      ];
      break;
    case 'matrix':
      base.scoring = true; base.default = {};
      base.rows = [
        { id: uid('r'), label: '征象 1' }, { id: uid('r'), label: '征象 2' }, { id: uid('r'), label: '征象 3' }
      ];
      base.cols = [
        { id: uid('c'), label: '1 级', points: 0 }, { id: uid('c'), label: '2 级', points: 1 }, { id: uid('c'), label: '3 级', points: 2 }
      ];
      break;
    case 'sectionTitle':
      base.report.includeInFinding = false;
      break;
    case 'logicStage':
      base.computed = 'stage'; base.report.includeInFinding = false;
      break;
    case 'scoreTotal':
      base.computed = 'score_total'; base.report.includeInFinding = false;
      break;
    case 'category':
      base.computed = 'category'; base.report.includeInFinding = false;
      break;
  }
  return { ...base, ...overrides, report: { ...base.report, ...(overrides.report || {}) } };
}

function defaultValues(t) {
  const v = {};
  (t.fields || []).forEach((f) => {
    if (f.type === 'checkboxGroup') v[f.variable] = Array.isArray(f.default) ? f.default : [];
    else if (f.type === 'matrix') v[f.variable] = (f.default && typeof f.default === 'object') ? f.default : {};
    else v[f.variable] = (f.default !== undefined && f.default !== null) ? f.default : null;
  });
  return v;
}

function valuesFromDefaults(t) {
  return defaultValues(t);
}

function renderValue(field, v) {
  if (v === null || v === undefined) return '';
  if (field.type === 'checkboxGroup') {
    return (v || []).map((val) => {
      const o = (field.options || []).find((x) => x.value === val);
      return o ? o.label : val;
    }).join('、');
  }
  if (field.type === 'matrix') {
    return (field.rows || []).map((r) => {
      const colId = (v || {})[r.id];
      const c = (field.cols || []).find((x) => x.id === colId);
      return `${r.label}: ${c ? c.label : '未选'}`;
    }).join('；');
  }
  if (field.type === 'radio' || field.type === 'select' || field.type === 'scoreRadio') {
    const o = (field.options || []).find((x) => x.value === v);
    return o ? (o.label || o.value) : String(v);
  }
  return v;
}

function computeScore(t, vals) {
  let total = 0;
  (t.fields || []).forEach((f) => {
    if (!f.scoring) return;
    if (f.type === 'scoreRadio') {
      const v = vals[f.variable];
      const o = (f.options || []).find((x) => x.value === v);
      if (o) total += Number(o.points || 0);
    } else if (f.type === 'matrix') {
      const obj = vals[f.variable] || {};
      (f.rows || []).forEach((r) => {
        const colId = obj[r.id];
        const c = (f.cols || []).find((x) => x.id === colId);
        if (c) total += Number(c.points || 0);
      });
    }
  });
  return total;
}

function computeCategory(t, total) {
  return (t.categoryMapping || []).find((r) => total >= r.min && total <= r.max) || null;
}

function resolveStage(t, vals) {
  if (!t.stageEnabled) return null;
  const T = vals.t_stage, N = vals.n_stage, M = vals.m_stage;
  for (const r of (t.stageRules || [])) {
    const tOk = !r.t || r.t.length === 0 || (T && r.t.includes(T));
    const nOk = !r.n || r.n.length === 0 || (N && r.n.includes(N));
    const mOk = !r.m || r.m.length === 0 || (M && r.m.includes(M));
    if (tOk && nOk && mOk) return r.stage;
  }
  return '待推导';
}

function isVisible(field, vals) {
  if (!field.condition || !field.condition.clauses || field.condition.clauses.length === 0) return true;
  return field.condition.clauses.every((c) => {
    const actual = vals[c.field];
    if (c.op === 'eq') return actual === c.value;
    if (c.op === 'ne') return actual !== c.value;
    if (c.op === 'in') return Array.isArray(c.value) && c.value.includes(actual);
    if (c.op === 'notIn') return Array.isArray(c.value) && !c.value.includes(actual);
    if (c.op === 'gt') return Number(actual) > Number(c.value);
    if (c.op === 'lt') return Number(actual) < Number(c.value);
    return true;
  });
}

function buildCtx(t, vals) {
  const ctx = {};
  (t.fields || []).forEach((f) => {
    ctx[f.variable] = renderValue(f, vals[f.variable]);
    if (f.type === 'radio' || f.type === 'select') {
      const o = (f.options || []).find((x) => x.value === vals[f.variable]);
      ctx[f.variable + '_desc'] = o ? (o.desc || '') : '';
    }
  });
  const total = computeScore(t, vals);
  ctx.score_total = total;
  ctx.stage = resolveStage(t, vals);
  ctx.stage_advice = (t.stageAdvice && t.stageAdvice[ctx.stage]) || '';
  const cat = computeCategory(t, total);
  ctx.category = cat ? cat.category : '—';
  ctx.category_desc = cat ? cat.desc : '';
  ctx.category_advice = cat ? cat.advice : '';
  return ctx;
}

function buildFindings(t, vals) {
  const ctx = buildCtx(t, vals);
  const tpl = t.report && t.report.findingsTemplate;
  if (tpl && tpl.trim()) return compile(tpl, ctx);
  const parts = [];
  (t.fields || []).forEach((f) => {
    if (['sectionTitle', 'logicStage', 'scoreTotal', 'category'].includes(f.type)) return;
    if (!isVisible(f, vals)) return;
    const raw = vals[f.variable];
    if (raw === null || raw === '' || (Array.isArray(raw) && raw.length === 0) || (f.type === 'matrix' && !Object.keys(raw || {}).length)) return;
    if (!f.report || !f.report.finding || !f.report.includeInFinding) return;
    const txt = compile(f.report.finding, { ...ctx, value: renderValue(f, raw) });
    if (txt.trim()) parts.push(txt.trim());
  });
  return parts.join('\n');
}

function buildConclusion(t, vals) {
  const ctx = buildCtx(t, vals);
  return compile(t.report && t.report.conclusionTemplate, ctx);
}

function buildSchema(t) {
  const properties = {};
  const required = [];
  (t.fields || []).forEach((f) => {
    if (f.type === 'sectionTitle') return;
    let schema = { title: f.label, 'x-variable': f.variable };
    switch (f.type) {
      case 'radio':
      case 'select':
      case 'scoreRadio':
        schema.type = 'string';
        schema.enum = (f.options || []).map((o) => o.value);
        schema.default = f.default;
        if (f.scoring) schema['x-scoring'] = true;
        break;
      case 'checkboxGroup':
        schema.type = 'array';
        schema.items = { type: 'string', enum: (f.options || []).map((o) => o.value) };
        schema.default = f.default || [];
        schema.uniqueItems = true;
        break;
      case 'number':
        schema.type = 'number';
        schema.minimum = f.min; schema.maximum = f.max; schema.default = f.default; schema.unit = f.unit;
        break;
      case 'text':
      case 'textarea':
        schema.type = 'string'; schema.default = f.default || '';
        break;
      case 'matrix':
        schema.type = 'object'; schema['x-scoring'] = true; schema.default = f.default || {};
        schema.rows = f.rows || []; schema.cols = f.cols || [];
        break;
      case 'logicStage':
        schema.readOnly = true; schema.type = 'string'; schema['x-computed'] = 'stage'; schema.default = f.default || null;
        break;
      case 'scoreTotal':
        schema.readOnly = true; schema.type = 'number'; schema['x-computed'] = 'score_total'; schema.default = null;
        break;
      case 'category':
        schema.readOnly = true; schema.type = 'string'; schema['x-computed'] = 'category'; schema.default = null;
        break;
    }
    if (f.required && !['logicStage', 'scoreTotal', 'category'].includes(f.type)) required.push(f.variable);
    if (f.condition) schema['x-visibleWhen'] = f.condition;
    if (f.report && f.report.finding) schema['x-reportFinding'] = f.report.finding;
    if (f.required) schema['x-required'] = true;
    properties[f.variable] = schema;
  });
  return {
    $schema: 'https://json-schema.org/draft/2020-12/schema',
    title: t.name,
    description: t.desc,
    version: t.version,
    standard: t.standard,
    type: 'object',
    additionalProperties: false,
    required,
    properties,
    'x-report': t.report,
    'x-scoring': { enabled: t.scoringEnabled, categoryMapping: t.categoryMapping },
    'x-stage': { enabled: t.stageEnabled, rules: t.stageRules, advice: t.stageAdvice }
  };
}

const inputCls = 'w-full rounded-lg border border-line bg-ink-850 px-2.5 py-2 text-[13px] text-txt-hi outline-none transition focus:border-brand/60 placeholder:text-txt-low';

function MultiSelect({ options = [], value = [], onChange, placeholder = '任意', small = false }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    window.addEventListener('mousedown', h);
    return () => window.removeEventListener('mousedown', h);
  }, []);
  const selected = options.filter((o) => value.includes(o.value));
  return (
    <div className="relative" ref={ref}>
      <button type="button" onClick={() => setOpen((v) => !v)}
        className={cx('flex w-full items-center justify-between gap-1.5 rounded-lg border border-line bg-ink-850 px-2 text-left text-xs text-txt-hi transition hover:border-brand/50',
          small ? 'py-1' : 'py-1.5')}>
        <span className="truncate">{selected.length ? selected.map((o) => o.label).join('、') : <span className="text-txt-low">{placeholder}</span>}</span>
        <Icon name="chevron-down" className="h-3.5 w-3.5 shrink-0 text-txt-low" />
      </button>
      {open && (
        <div className="absolute z-30 mt-1 max-h-48 w-56 overflow-auto rounded-lg border border-line bg-ink-800 p-1.5 shadow-2xl">
          {options.map((o) => {
            const on = value.includes(o.value);
            return (
              <button key={o.value} type="button"
                onClick={() => onChange(on ? value.filter((x) => x !== o.value) : [...value, o.value])}
                className={cx('flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-xs', on ? 'bg-brand-soft text-txt-hi' : 'text-txt-mid hover:bg-white/5')}>
                <span className={cx('grid h-3.5 w-3.5 place-items-center rounded border', on ? 'border-brand bg-brand text-white' : 'border-line')}>
                  {on ? <Icon name="check" className="h-2.5 w-2.5" /> : null}
                </span>
                <span className="truncate">{o.label}</span>
                {o.points !== undefined ? <span className="ml-auto font-mono text-[10px] text-txt-low">+{o.points}</span> : null}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function OptionPill({ opt, selected, fieldType, readOnly, onPick }) {
  const scoring = fieldType === 'scoreRadio';
  return (
    <button type="button"
      onClick={() => !readOnly && onPick(opt.value)}
      className={cx('rounded-lg border px-2.5 py-1.5 text-left text-xs transition',
        selected ? 'border-brand/70 bg-brand-soft text-white ring-1 ring-brand/40' : 'border-line bg-ink-850 text-txt-mid hover:border-brand/40',
        readOnly ? 'cursor-default' : 'cursor-pointer')}>
      <span className="font-semibold">{opt.label}</span>
      {opt.desc ? <span className="ml-1.5 text-[10px] opacity-70">{opt.desc}</span> : null}
      {scoring ? (
        <span className={cx('ml-1.5 rounded px-1 py-0.5 font-mono text-[10px]',
          opt.points > 2 ? 'bg-bad/20 text-bad' : opt.points > 0 ? 'bg-warn/20 text-warn' : 'bg-white/10 text-txt-mid')}>
          +{opt.points || 0}
        </span>
      ) : null}
    </button>
  );
}

function FieldControl({ field, value, onChange, readOnly }) {
  const opts = field.options || [];
  if (field.type === 'radio' || field.type === 'scoreRadio') {
    return (
      <div className="flex flex-wrap gap-1.5">
        {opts.map((o) => (
          <OptionPill key={o.id} opt={o} fieldType={field.type} selected={value === o.value} readOnly={readOnly} onPick={onChange} />
        ))}
      </div>
    );
  }
  if (field.type === 'select') {
    if (readOnly) {
      const o = opts.find((x) => x.value === value);
      return <div className={cx('flex items-center justify-between rounded-lg border border-line bg-ink-850 px-2.5 py-2 text-xs text-txt-hi')}>
        <span>{o ? o.label : '请选择'}</span><Icon name="chevron-down" className="h-3.5 w-3.5 text-txt-low" />
      </div>;
    }
    return (
      <select className={inputCls} value={value || ''} onChange={(e) => onChange(e.target.value)}>
        <option value="">请选择</option>
        {opts.map((o) => <option key={o.id} value={o.value}>{o.label}</option>)}
      </select>
    );
  }
  if (field.type === 'checkboxGroup') {
    const arr = value || [];
    return (
      <div className="flex flex-wrap gap-1.5">
        {opts.map((o) => {
          const on = arr.includes(o.value);
          return (
            <button key={o.id} type="button"
              onClick={() => !readOnly && onChange(on ? arr.filter((x) => x !== o.value) : [...arr, o.value])}
              className={cx('rounded-lg border px-2.5 py-1.5 text-xs transition',
                on ? 'border-brand/70 bg-brand-soft text-white' : 'border-line bg-ink-850 text-txt-mid',
                readOnly ? 'cursor-default' : 'cursor-pointer hover:border-brand/40')}>
              {o.label}
            </button>
          );
        })}
      </div>
    );
  }
  if (field.type === 'number') {
    return (
      <div className="relative">
        <input type="number" min={field.min} max={field.max} step="any" value={value ?? ''}
          disabled={readOnly} onChange={(e) => onChange(e.target.value === '' ? null : Number(e.target.value))}
          className={cx(inputCls, 'pr-14')} placeholder={`${field.min || 0} - ${field.max || 100}`} />
        {field.unit ? <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-txt-low">{field.unit}</span> : null}
      </div>
    );
  }
  if (field.type === 'text') {
    return <input type="text" className={inputCls} value={value || ''} disabled={readOnly} onChange={(e) => onChange(e.target.value)} placeholder="输入文本" />;
  }
  if (field.type === 'textarea') {
    return <textarea className={cx(inputCls, 'min-h-[80px] resize-y')} value={value || ''} disabled={readOnly} onChange={(e) => onChange(e.target.value)} placeholder="输入长文本" />;
  }
  if (field.type === 'matrix') {
    const rows = field.rows || [], cols = field.cols || [], obj = value || {};
    return (
      <table className="w-full border-collapse overflow-hidden rounded-lg text-xs">
        <thead>
          <tr>
            <th className="border border-line bg-ink-850 px-2 py-1.5 text-left font-medium text-txt-low">征象</th>
            {cols.map((c) => (
              <th key={c.id} className="border border-line bg-ink-850 px-2 py-1.5 text-center font-medium text-txt-hi">
                {c.label}<div className="font-mono text-[10px] font-normal text-txt-low">+{c.points || 0}</div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.id}>
              <td className="border border-line bg-ink-900/40 px-2 py-1.5 text-txt-mid">{r.label}</td>
              {cols.map((c) => {
                const on = obj[r.id] === c.id;
                return (
                  <td key={c.id} className="border border-line px-1 py-1 text-center">
                    <button type="button"
                      onClick={() => !readOnly && onChange({ ...obj, [r.id]: c.id })}
                      className={cx('h-5 w-5 rounded-full border transition', on ? 'border-brand bg-brand shadow-[0_0_0_3px_rgba(46,120,255,0.18)]' : 'border-line bg-ink-850', readOnly ? 'cursor-default' : 'cursor-pointer')} />
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    );
  }
  if (field.type === 'sectionTitle') {
    return <div className="text-sm font-semibold text-txt-hi">{field.label}</div>;
  }
  return null;
}

    <aside className="flex w-[300px] shrink-0 flex-col border-r border-line bg-ink-900/60">

        <h2 className="text-sm font-semibold text-txt-hi">组件库</h2>
        <Icon name="boxes" className="h-4 w-4 text-txt-low" />
      </div>
      <div className="px-4">
        <div className="flex gap-1 rounded-lg border border-line bg-ink-900 p-0.5">
          {[['fields', '基础控件'], ['modules', '逻辑模块'], ['outline', '大纲']].map(([k, label]) => (
            <button key={k} type="button" onClick={() => setTab(k)}
              className={cx('flex-1 rounded-md px-2 py-1.5 text-xs font-medium transition', tab === k ? 'bg-ink-700 text-white' : 'text-txt-mid hover:text-txt-hi')}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {tab === 'fields' && (
        <div className="grid flex-1 grid-cols-2 content-start gap-2.5 overflow-y-auto p-4">
          {BASIC_LIB.map((item) => (
            <button key={item.type} type="button"
              draggable
              onClick={() => onAdd(item.type)}
              onDragStart={(e) => drag(e, { kind: 'type', type: item.type })}
              className="group cursor-grab rounded-xl border border-line bg-ink-850 p-3 text-left transition hover:border-brand/60 hover:bg-ink-800 active:cursor-grabbing">
              <div className="flex items-center justify-between">
                <Icon name={item.icon} className="h-4 w-4 text-brand" />
                <Icon name="grip-vertical" className="h-3.5 w-3.5 text-txt-low opacity-0 transition group-hover:opacity-100" />
              </div>
              <div className="mt-2 text-xs font-medium text-txt-hi">{item.label}</div>
              <div className="mt-0.5 text-[10px] leading-snug text-txt-low">{item.desc}</div>
            </button>
          ))}
        </div>
      )}

      {tab === 'modules' && (
        <div className="flex flex-1 flex-col gap-2.5 overflow-y-auto p-4">
          {MODULES.map((m) => (
            <button key={m.id} type="button"
              draggable
              onClick={() => onModule(m.id)}
              onDragStart={(e) => drag(e, { kind: 'module', id: m.id })}
              className="group cursor-grab rounded-xl border border-line bg-gradient-to-br from-ink-850 to-ink-900 p-3.5 text-left transition hover:border-brand/60 hover:from-ink-800 hover:to-ink-900 active:cursor-grabbing">
              <div className="flex items-start gap-3">
                <div className="grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-brand/30 bg-brand-soft text-brand">
                  <Icon name={m.icon} className="h-4 w-4" />
                </div>
                <div className="min-w-0">
                  <div className="text-[13px] font-semibold text-txt-hi">{m.label}</div>
                  <div className="mt-1 text-[11px] leading-snug text-txt-low">{m.desc}</div>
                </div>
              </div>
            </button>
          ))}
          <div className="rounded-xl border border-dashed border-line p-3 text-[11px] leading-relaxed text-txt-low">
            拖动组件到中间画布的分组卡内；或单击组件，添加到当前高亮分组。
          </div>
        </div>
      )}

      {tab === 'outline' && (
        <div className="flex-1 overflow-y-auto p-4">
          {draft.groups.map((g) => (
            <div key={g.id} className="mb-4">
              <div className="mb-2 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-txt-low">
                <Icon name={g.icon} className="h-3.5 w-3.5" />{g.title}
              </div>
              <div className="space-y-1 border-l border-line pl-3">
                {draft.fields.filter((f) => f.groupId === g.id).map((f) => (
                  <button key={f.id} type="button" onClick={() => onSelectOutline(f.id)}
                    className={cx('block w-full truncate rounded-md px-2 py-1 text-left text-xs transition', selectedId === f.id ? 'bg-brand-soft text-txt-hi' : 'text-txt-mid hover:bg-white/5 hover:text-txt-hi')}>
                    {f.label}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </aside>
  );
}

/* ============================================================
   center canvas — field block
   ============================================================ */
function FieldBlock({ field, designVals, designCtx, draft, selected, isOver, onClick, onDelete, onDragStart, onDragOver, onDrop, onValueChange }) {
  const dim = field.condition && !isVisible(field, designVals);
  const scoreTotal = computeScore(draft, designVals);
  const cat = computeCategory(draft, scoreTotal);
  const handleDragStart = (e) => {
    if (e.target && e.target.closest && e.target.closest('input, select, textarea, button')) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (onDragStart) onDragStart(e);
  };
  return (
    <div
      draggable
      onClick={onClick}
      onDragStart={handleDragStart}
      onDragOver={onDragOver}
      onDrop={onDrop}
      onDragEnd={onDrop}
      className={cx(
        'group relative rounded-xl border p-3.5 transition',
        selected ? 'border-brand/70 bg-brand-soft/40 ring-1 ring-brand/30' : 'border-line bg-ink-850/70 hover:border-white/20',
        isOver && 'border-brand ring-2 ring-brand/30',
        dim && 'opacity-70'
      )}>
      <div className="flex items-start gap-2.5">
        <div className="mt-0.5 h-6 w-6 shrink-0 cursor-grab rounded-md border border-line bg-ink-800 text-txt-low active:cursor-grabbing">
          <Icon name="grip-vertical" className="mx-auto mt-1 h-4 w-4" />
        </div>
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-[13px] font-semibold text-txt-hi">{field.label}</span>
            {field.required ? <span className="text-xs text-bad">*</span> : null}
            <code className="rounded bg-ink-900 px-1.5 py-0.5 font-mono text-[10px] text-brand">{`{${field.variable}}`}</code>
            {field.condition ? (
              <span className="inline-flex items-center gap-1 rounded bg-warn/15 px-1.5 py-0.5 text-[10px] text-warn">
                <Icon name="filter" className="h-3 w-3" />条件显示
              </span>
            ) : null}
            {field.scoring ? <span className="rounded bg-teal/15 px-1.5 py-0.5 text-[10px] text-teal">赋分</span> : null}
            {field.computed ? <span className="rounded bg-violet/15 px-1.5 py-0.5 text-[10px] text-violet">自动</span> : null}
            <span className="ml-auto opacity-0 transition group-hover:opacity-100">
              <button type="button" onClick={(e) => { e.stopPropagation(); onDelete(field.id); }}
                className="rounded-md border border-line bg-ink-900 p-1 text-txt-low hover:border-bad/50 hover:text-bad">
                <Icon name="trash-2" className="h-3.5 w-3.5" />
              </button>
            </span>
          </div>
          <div className="mt-2.5" onMouseDown={(e) => { if (e.target.closest && e.target.closest('input, select, textarea, button')) e.stopPropagation(); }}>
            {field.type === 'logicStage' ? (
              <div className="rounded-lg border border-brand-line bg-brand-soft p-3">
                <div className="flex items-center gap-2 text-[10px] uppercase tracking-wider text-txt-mid"><Icon name="git-branch" className="h-3.5 w-3.5" />自动推导分期</div>
                <div className="mt-1 text-xl font-bold text-brand">{designCtx.stage || '待推导'}</div>
                <div className="mt-0.5 text-[11px] text-txt-mid">依据：{designCtx.t_stage || '—'} + {designCtx.n_stage || '—'} + {designCtx.m_stage || '—'}</div>
              </div>
            ) : field.type === 'scoreTotal' ? (
              <div className="flex items-center justify-between rounded-lg border border-teal/30 bg-teal/10 px-3 py-2">
                <span className="text-[11px] uppercase tracking-wider text-txt-mid">征象总分</span>
                <span className="font-mono text-2xl font-bold text-teal tabular">{scoreTotal}</span>
              </div>
            ) : field.type === 'category' ? (
              <div className="flex items-center justify-between rounded-lg border border-line bg-ink-900 px-3 py-2">
                <span className="text-[11px] uppercase tracking-wider text-txt-mid">评估分级</span>
                <span className="rounded-lg bg-teal/20 px-2 py-1 text-sm font-bold text-teal">{cat ? cat.category : '待分级'}</span>
              </div>
            ) : (
              <FieldControl
                field={field}
                value={designVals[field.variable]}
                onChange={(v) => onValueChange && onValueChange(field.variable, v)}
                readOnly={false}
              />
            )}
          </div>
          {dim ? (
            <div className="mt-2 flex items-center gap-1.5 rounded-lg border border-warn/20 bg-warn/10 px-2 py-1.5 text-[11px] text-warn">
              <Icon name="eye-off" className="h-3.5 w-3.5" />当前条件下不显示（例：M1 时才显示转移部位）
            </div>
          ) : null}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   right panel — field inspector
   ============================================================ */
function OptionsEditor({ field, updateField }) {
  const updateOpt = (id, patch) => updateField(field.id, { options: field.options.map((o) => o.id === id ? { ...o, ...patch } : o) });
  const addOpt = () => {
    const isScore = field.type === 'scoreRadio';
    const o = { id: uid('o'), value: `option_${(field.options || []).length + 1}`, label: `选项 ${(field.options || []).length + 1}` };
    if (isScore) o.points = field.options.length;
    updateField(field.id, { options: [...(field.options || []), o] });
  };
  const removeOpt = (id) => updateField(field.id, { options: field.options.filter((o) => o.id !== id) });
  return (
    <Section title="选项与分值" desc="值用于 JSON Schema，分值为报告自动评分使用">
      <div className="space-y-2">
        {(field.options || []).map((o) => (
          <div key={o.id} className="flex items-center gap-1.5">
            <input className={cx(inputCls, 'flex-1')} value={o.label} placeholder="显示名称" onChange={(e) => updateOpt(o.id, { label: e.target.value })} />
            <input className={cx(inputCls, 'w-24 font-mono')} value={o.value} placeholder="value" onChange={(e) => updateOpt(o.id, { value: e.target.value })} />
            {field.type === 'scoreRadio' ? (
              <input className={cx(inputCls, 'w-14 font-mono tabular')} type="number" value={o.points} onChange={(e) => updateOpt(o.id, { points: Number(e.target.value) })} />
            ) : null}
            <button type="button" onClick={() => removeOpt(o.id)} className="rounded-md border border-line bg-ink-900 p-1.5 text-txt-low hover:border-bad/50 hover:text-bad"><Icon name="x" className="h-3.5 w-3.5" /></button>
          </div>
        ))}
      </div>
      <button type="button" onClick={addOpt} className="mt-2 flex items-center gap-1.5 rounded-lg border border-dashed border-line px-3 py-2 text-xs text-txt-mid transition hover:border-brand/50 hover:text-txt-hi">
        <Icon name="plus" className="h-3.5 w-3.5" />添加选项
      </button>
    </Section>
  );
}

function MatrixEditor({ field, updateField }) {
  return (
    <Section title="分级矩阵" desc="行=征象，列=分级，每列可设分值">
      <Label>列（分级 / 分值）</Label>
      <div className="space-y-1.5">
        {(field.cols || []).map((c, i) => (
          <div key={c.id} className="flex items-center gap-1.5">
            <input className={cx(inputCls, 'flex-1')} value={c.label} onChange={(e) => updateField(field.id, { cols: field.cols.map((x) => x.id === c.id ? { ...x, label: e.target.value } : x) })} />
            <input className={cx(inputCls, 'w-14 font-mono tabular')} type="number" value={c.points} onChange={(e) => updateField(field.id, { cols: field.cols.map((x) => x.id === c.id ? { ...x, points: Number(e.target.value) } : x) })} />
            <button type="button" onClick={() => updateField(field.id, { cols: field.cols.filter((x) => x.id !== c.id) })} className="rounded-md border border-line bg-ink-900 p-1.5 text-txt-low hover:text-bad"><Icon name="x" className="h-3.5 w-3.5" /></button>
          </div>
        ))}
      </div>
      <Label>行（征象）</Label>
      <div className="space-y-1.5">
        {(field.rows || []).map((r) => (
          <div key={r.id} className="flex items-center gap-1.5">
            <input className={inputCls} value={r.label} onChange={(e) => updateField(field.id, { rows: field.rows.map((x) => x.id === r.id ? { ...x, label: e.target.value } : x) })} />
            <button type="button" onClick={() => updateField(field.id, { rows: field.rows.filter((x) => x.id !== r.id) })} className="rounded-md border border-line bg-ink-900 p-1.5 text-txt-low hover:text-bad"><Icon name="x" className="h-3.5 w-3.5" /></button>
          </div>
        ))}
      </div>
      <div className="mt-2 flex gap-2">
        <button type="button" onClick={() => updateField(field.id, { cols: [...(field.cols || []), { id: uid('c'), label: `分级 ${(field.cols || []).length + 1}`, points: (field.cols || []).length }] })} className="rounded-lg border border-dashed border-line px-3 py-1.5 text-xs text-txt-mid hover:border-brand/50 hover:text-txt-hi">+ 加列</button>
        <button type="button" onClick={() => updateField(field.id, { rows: [...(field.rows || []), { id: uid('r'), label: `征象 ${(field.rows || []).length + 1}` }] })} className="rounded-lg border border-dashed border-line px-3 py-1.5 text-xs text-txt-mid hover:border-brand/50 hover:text-txt-hi">+ 加行</button>
      </div>
    </Section>
  );
}

function ConditionEditor({ field, draft, updateField }) {
  const targetFields = draft.fields.filter((f) => f.id !== field.id && ['radio', 'select', 'scoreRadio', 'checkboxGroup', 'number'].includes(f.type));
  const cond = field.condition;
  const clauses = cond ? cond.clauses : [];
  const setCond = (next) => updateField(field.id, { condition: next });
  const toggle = (v) => setCond(v ? { join: 'and', clauses: [{ field: targetFields[0] ? targetFields[0].variable : '', op: 'eq', value: '' }] } : null);
  const updateClause = (idx, patch) => setCond({ ...cond, clauses: clauses.map((c, i) => i === idx ? { ...c, ...patch } : c) });
  const targetField = (c) => draft.fields.find((f) => f.variable === c.field);
  return (
    <Section title="条件显示" desc="满足条件后才在医生填报界面显示该字段">
      <div className="flex items-center justify-between">
        <span className="text-xs text-txt-mid">启用条件显示</span>
        <Toggle checked={!!cond} onChange={toggle} />
      </div>
      {clauses.length === 0 ? null : (
        <div className="mt-3 space-y-2">
          {clauses.map((c, i) => {
            const tf = targetField(c);
            const opts = tf ? (tf.options || []) : [];
            return (
              <div key={i} className="rounded-lg border border-line bg-ink-850 p-3">
                <div className="grid grid-cols-[1fr_auto] gap-2">
                  <select className={inputCls} value={c.field} onChange={(e) => updateClause(i, { field: e.target.value, op: 'eq', value: '' })}>
                    <option value="">选择字段</option>
                    {targetFields.map((f) => <option key={f.id} value={f.variable}>{f.label}</option>)}
                  </select>
                  <button type="button" onClick={() => setCond({ ...cond, clauses: clauses.filter((_, x) => x !== i) })} className="rounded-md border border-line bg-ink-900 px-2 text-txt-low hover:border-bad/50 hover:text-bad"><Icon name="x" className="h-3.5 w-3.5" /></button>
                </div>
                <select className={cx(inputCls, 'mt-2')} value={c.op} onChange={(e) => updateClause(i, { op: e.target.value, value: e.target.value === 'in' || e.target.value === 'notIn' ? [] : '' })}>
                  <option value="eq">等于</option><option value="ne">不等于</option>
                  <option value="in">包含于</option><option value="notIn">不包含于</option>
                  <option value="gt">大于</option><option value="lt">小于</option>
                </select>
                <div className="mt-2">
                  {c.op === 'in' || c.op === 'notIn' ? (
                    <MultiSelect options={opts} value={c.value || []} onChange={(v) => updateClause(i, { value: v })} placeholder="选择一个或多个值" />
                  ) : tf && tf.type === 'number' ? (
                    <input type="number" className={inputCls} value={c.value || ''} onChange={(e) => updateClause(i, { value: Number(e.target.value) })} placeholder="数值" />
                  ) : (
                    <select className={inputCls} value={c.value || ''} onChange={(e) => updateClause(i, { value: e.target.value })}>
                      <option value="">选择值</option>
                      {opts.map((o) => <option key={o.id} value={o.value}>{o.label}</option>)}
                    </select>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {cond ? (
        <button type="button" onClick={() => setCond({ ...cond, clauses: [...clauses, { field: '', op: 'eq', value: '' }] })} className="mt-2 flex items-center gap-1.5 rounded-lg border border-dashed border-line px-3 py-2 text-xs text-txt-mid hover:border-brand/50 hover:text-txt-hi">
          <Icon name="plus" className="h-3.5 w-3.5" />添加「与」条件
        </button>
      ) : null}
    </Section>
  );
}

function ReportFieldEditor({ field, updateField, draft }) {
  const vars = draft.fields.map((f) => f.variable).filter(Boolean);
  const insert = (v) => updateField(field.id, { report: { ...field.report, finding: (field.report?.finding || '') + `{${v}}` } });
  return (
    <Section title="报告生成规则" desc="选中该选项时，按此语句拼接 Findings 自然语言">
      <div className="flex items-center justify-between">
        <span className="text-xs text-txt-mid">纳入 Findings</span>
        <Toggle checked={field.report?.includeInFinding !== false} onChange={(v) => updateField(field.id, { report: { ...field.report, includeInFinding: v } })} />
      </div>
      <textarea className={cx(inputCls, 'mt-3 min-h-[90px] resize-y font-mono')} value={field.report?.finding || ''}
        onChange={(e) => updateField(field.id, { report: { ...field.report, finding: e.target.value } })}
        placeholder="例：原发肿瘤评估为 {value}，{t_stage_desc}。" />
      <div className="mt-2 flex flex-wrap gap-1.5">
        {vars.map((v) => (
          <button key={v} type="button" onClick={() => insert(v)} className="rounded-md bg-brand-soft px-1.5 py-0.5 font-mono text-[10px] text-brand hover:bg-brand/25">{`{${v}}`}</button>
        ))}
      </div>
    </Section>
  );
}

function FieldInspector({ draft, field, updateField, removeField, goRules }) {
  if (!field) {
    return (
      <div className="grid h-full place-items-center p-10 text-center">
        <div className="mx-auto grid h-12 w-12 place-items-center rounded-xl border border-line bg-ink-850 text-txt-low"><Icon name="mouse-pointer-2" className="h-5 w-5" /></div>
        <div className="mt-3 text-sm font-medium text-txt-hi">点击画布中的字段进行配置</div>
        <div className="mt-1.5 max-w-[260px] text-xs leading-relaxed text-txt-low">可配置名称、变量标识、必填/默认值、选项分值、条件显示规则与报告语句。</div>
      </div>
    );
  }
  const hasOptions = ['radio', 'select', 'checkboxGroup', 'scoreRadio'].includes(field.type);
  const isComputed = ['logicStage', 'scoreTotal', 'category'].includes(field.type);
  return (
    <div className="space-y-4 p-4">
      <div className="flex items-center gap-3">
        <div className="grid h-10 w-10 place-items-center rounded-lg border border-brand/30 bg-brand-soft text-brand"><Icon name={FIELD_ICON[field.type]} className="h-4.5 w-4.5" /></div>
        <div className="min-w-0 flex-1">
          <div className="truncate text-sm font-semibold text-txt-hi">{field.label}</div>
          <div className="text-[11px] text-txt-low">{FIELD_TYPE_LABEL[field.type]}</div>
        </div>
        <button type="button" onClick={() => removeField(field.id)} className="rounded-md border border-line bg-ink-900 p-2 text-txt-low hover:border-bad/50 hover:text-bad"><Icon name="trash-2" className="h-4 w-4" /></button>
      </div>

      <Section title="基本属性">
        <Label>字段名称</Label>
        <input className={inputCls} value={field.label} onChange={(e) => updateField(field.id, { label: e.target.value })} />
        <div className="mt-3"><Label>变量标识符</Label></div>
        <input className={cx(inputCls, 'font-mono')} value={field.variable} onChange={(e) => updateField(field.id, { variable: e.target.value.replace(/\s/g, '_') })} />
        <div className="mt-2 text-[10px] text-txt-low">用于 JSON Schema 属性名与报告变量引用。</div>
        {!isComputed && field.type !== 'sectionTitle' ? (
          <div className="mt-3 flex items-center justify-between">
            <span className="text-xs text-txt-mid">必填字段</span>
            <Toggle checked={field.required} onChange={(v) => updateField(field.id, { required: v })} />
          </div>
        ) : null}
      </Section>

      {field.type === 'number' ? (
        <Section title="数值配置">
          <div className="grid grid-cols-3 gap-2">
            <div><Label>单位</Label><input className={inputCls} value={field.unit || ''} onChange={(e) => updateField(field.id, { unit: e.target.value })} placeholder="mm" /></div>
            <div><Label>最小值</Label><input className={inputCls} type="number" value={field.min} onChange={(e) => updateField(field.id, { min: Number(e.target.value) })} /></div>
            <div><Label>最大值</Label><input className={inputCls} type="number" value={field.max} onChange={(e) => updateField(field.id, { max: Number(e.target.value) })} /></div>
          </div>
        </Section>
      ) : null}

      {hasOptions ? <OptionsEditor field={field} updateField={updateField} /> : null}
      {field.type === 'matrix' ? <MatrixEditor field={field} updateField={updateField} /> : null}

      {field.type === 'logicStage' ? (
        <Section title="推导规则">
          <div className="text-xs leading-relaxed text-txt-mid">此字段结果由「规则引擎」中的分期推导规则自动得出。</div>
          <button type="button" onClick={goRules} className="mt-2 flex items-center gap-1.5 rounded-lg border border-brand/40 bg-brand-soft px-3 py-2 text-xs font-medium text-brand hover:bg-brand/25"><Icon name="git-branch" className="h-3.5 w-3.5" />前往规则引擎</button>
        </Section>
      ) : null}
      {field.type === 'scoreTotal' || field.type === 'category' ? (
        <Section title="自动计算">
          <div className="text-xs leading-relaxed text-txt-mid">{field.type === 'scoreTotal' ? '由所有标记为「赋分」的字段求和得出。' : '由总分按「规则引擎」中的阈值分级映射得出。'}</div>

      return next;

function ExportModal({ draft, onClose }) {
  const schemaStr = useMemo(() => JSON.stringify(buildSchema(draft), null, 2), [draft]);
  const [copied, setCopied] = useState(false);
  const copy = () => {
    try { navigator.clipboard.writeText(schemaStr).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); }); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = schemaStr; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); setCopied(true); setTimeout(() => setCopied(false), 1800); }
  };
  const download = () => {
    const blob = new Blob([schemaStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${draft.id || 'template'}.schema.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-8 backdrop-blur-sm" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="flex h-[84vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-line bg-ink-900 shadow-2xl">
        <div className="flex items-center gap-3 border-b border-line px-5 py-4">
          <div className="grid h-9 w-9 place-items-center rounded-lg border border-brand/30 bg-brand-soft text-brand"><Icon name="file-json" className="h-4 w-4" /></div>
          <div className="min-w-0 flex-1">
            <h3 className="text-sm font-semibold text-txt-hi">导出 JSON Schema</h3>
            <p className="text-[11px] text-txt-low">{schemaStr.length.toLocaleString()} 字符 · 可直接存入数据库或由 PACS 客户端解析运行</p>
          </div>
          <button type="button" onClick={onClose} className="rounded-md border border-line bg-ink-900 p-2 text-txt-low hover:text-txt-hi"><Icon name="x" className="h-4 w-4" /></button>
        </div>
        <div className="min-h-0 flex-1 overflow-auto p-5">
          <pre className="whitespace-pre-wrap break-all rounded-xl bg-ink-950 p-4 font-mono text-[11px] leading-relaxed text-txt-mid">{schemaStr}</pre>
        </div>
        <div className="flex items-center justify-end gap-2 border-t border-line px-5 py-3">
          <button type="button" onClick={download} className="flex items-center gap-1.5 rounded-lg border border-line bg-ink-900 px-3 py-2 text-xs font-medium text-txt-hi hover:border-brand/40">
            <Icon name="download" className="h-4 w-4" />下载 .json
          </button>
          <button type="button" onClick={copy} className={cx('flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-medium text-white transition', copied ? 'bg-ok' : 'bg-brand hover:bg-brand/90')}>
            <Icon name={copied ? 'check' : 'copy'} className="h-4 w-4" />{copied ? '已复制' : '复制 Schema'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   root app
   ============================================================ */
function App() {
  const [draft, setDraft] = useState(() => clone(PRESETS.tnm));
  const [mode, setMode] = useState('design');
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('tb-theme') || 'dark'; } catch (e) { return 'dark'; }
  });
  const [selectedId, setSelectedId] = useState(draft.fields[0] ? draft.fields[0].id : null);
  const [rightTab, setRightTab] = useState('field');
  const [activeGroup, setActiveGroup] = useState(draft.groups[0] ? draft.groups[0].id : null);
  const [exportOpen, setExportOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [dragging, setDragging] = useState(null);
  const [over, setOver] = useState(null);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    try { localStorage.setItem('tb-theme', theme); } catch (e) {}
  }, [theme]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const showToast = (msg) => setToast(msg);

  const switchTemplate = (id) => {
    const next = clone(PRESETS[id]);
    setDraft(next);
    setSelectedId(next.fields[0] ? next.fields[0].id : null);
    setActiveGroup(next.groups[0] ? next.groups[0].id : null);
    setRightTab('field');
  };

  const designVals = useMemo(() => valuesFromDefaults(draft), [draft]);
  const designCtx = useMemo(() => buildCtx(draft, designVals), [draft, designVals]);
  const designFindings = useMemo(() => buildFindings(draft, designVals), [draft, designVals]);
  const designConclusion = useMemo(() => buildConclusion(draft, designVals), [draft, designVals]);

  const patch = useCallback((p) => setDraft((d) => ({ ...d, ...p })), []);
  const updateField = useCallback((id, p) => {
    setDraft((d) => ({ ...d, fields: d.fields.map((f) => (f.id === id ? { ...f, ...p } : f)) }));
  }, []);

  const setFieldValue = useCallback((variable, value) => {
    setDraft((d) => ({
      ...d,
      fields: d.fields.map((f) => {
        if (f.variable !== variable) return f;
        let nextValue = value;
        if (Array.isArray(value)) nextValue = value.slice();
        else if (value && typeof value === 'object') nextValue = { ...value };
        return { ...f, default: nextValue };
      })
    }));
  }, []);

  const removeField = (id) => {
    setDraft((d) => ({ ...d, fields: d.fields.filter((f) => f.id !== id) }));
    if (selectedId === id) setSelectedId(null);
    showToast('字段已删除');
  };

  const selectField = (id, gid) => {
    setSelectedId(id);
    setRightTab('field');
    if (gid) setActiveGroup(gid);
  };

  const addField = (type, groupId, afterId = null, overrides = {}) => {
    const next = makeField(type, overrides);
    next.groupId = groupId;
    setDraft((d) => {
      const fields = [...d.fields];
      const idx = afterId ? fields.findIndex((f) => f.id === afterId) : -1;
      if (idx >= 0) fields.splice(idx + 1, 0, next); else fields.push(next);
      return { ...d, fields };
    });
    setSelectedId(next.id);
    setRightTab('field');
    setActiveGroup(groupId);
    showToast(`已添加「${next.label}」`);
  };

  const moduleFieldsFor = (moduleId, groupId, d) => {
    const list = [];
    const has = (v) => d.fields.some((f) => f.variable === v);
    if (moduleId === 'mod-tnm') {
      if (!has('t_stage')) list.push(makeField('radio', { label: 'T 分期（原发肿瘤）', variable: 't_stage', required: true, default: 'T2b', options: cloneOpts(T_OPTS), report: { finding: '原发肿瘤评估为 {value}，{t_stage_desc}。', includeInFinding: true } }));
      if (!has('n_stage')) list.push(makeField('radio', { label: 'N 分期（区域淋巴结）', variable: 'n_stage', required: true, default: 'N1', options: cloneOpts(N_OPTS), report: { finding: '区域淋巴结评估为 {value}，{n_stage_desc}。', includeInFinding: true } }));
      if (!has('m_stage')) list.push(makeField('radio', { label: 'M 分期（远处转移）', variable: 'm_stage', required: true, default: 'M0', options: cloneOpts(M_OPTS), report: { finding: '远处转移评估为 {value}，{m_stage_desc}。', includeInFinding: true } }));
      if (!has('metastasis_site')) list.push(makeField('checkboxGroup', { label: '远处转移部位', variable: 'metastasis_site', default: [], options: cloneOpts(MET_OPTS), condition: { join: 'and', clauses: [{ field: 'm_stage', op: 'in', value: ['M1a', 'M1b', 'M1c'] }] }, report: { finding: '考虑转移部位：{value}。', includeInFinding: true } }));
      if (!has('stage')) list.push(makeField('logicStage', { label: '自动推导分期', variable: 'stage' }));
    }
    if (moduleId === 'mod-rads') {
      const specs = [
        ['shape', '形态', SHAPE_OPTS, '分叶状', '形态{value}'],
        ['margin', '边界', MARGIN_OPTS, '毛刺', '边界{value}'],
        ['echoicity', '内部回声', ECHO_OPTS, '低回声', '内部回声{value}'],
        ['calcification', '钙化', CALC_OPTS, '簇状微钙化', '可见{value}'],
        ['vascularity', '血流', VASC_OPTS, '内部血流', '{value}'],
        ['posterior', '后方回声', POST_OPTS, '衰减', '后方回声{value}']
      ];
      specs.forEach(([variable, label, opts, def, finding]) => {
        if (!has(variable)) list.push(makeField('scoreRadio', { label, variable, scoring: true, required: true, default: def, options: cloneOpts(opts), report: { finding, includeInFinding: true } }));
      });
      if (!has('score_total')) list.push(makeField('scoreTotal', { label: '征象总分', variable: 'score_total' }));
      if (!has('category')) list.push(makeField('category', { label: 'BI-RADS 分级', variable: 'category' }));
    }
    return list.map((f) => { f.groupId = groupId; return f; });
  };

  const applyModule = (moduleId, groupId) => {
    if (moduleId === 'mod-condition') {
      const sel = draft.fields.find((f) => f.id === selectedId);
      if (!sel) { showToast('请先在画布中选择一个字段'); return; }
      if (['logicStage', 'scoreTotal', 'category', 'sectionTitle'].includes(sel.type)) { showToast('该字段不支持条件显示'); return; }
      setRightTab('field');
      showToast('已在右侧打开条件显示配置');
      return;
    }
    const current = draft;
    const additions = moduleFieldsFor(moduleId, groupId, current);
    setDraft((d) => ({ ...d, fields: [...d.fields, ...moduleFieldsFor(moduleId, groupId, d)] }));
    if (additions[0]) { setSelectedId(additions[0].id); setRightTab('field'); }
    showToast(`智能模块已添加 ${additions.length} 个字段`);
  };

  const moveField = (dragId, overId = null, newGroupId = null) => {
    setDraft((d) => {
      const drag = d.fields.find((f) => f.id === dragId);
      if (!drag) return d;
      let fields = d.fields.filter((f) => f.id !== dragId);
      const moved = { ...drag };
      if (newGroupId) moved.groupId = newGroupId;
      if (overId) {
        const idx = fields.findIndex((f) => f.id === overId);
        if (idx >= 0) fields.splice(idx, 0, moved); else fields.push(moved);
      } else {
        fields.push(moved);
      }
      return { ...d, fields };
    });
  };

  const updateRule = (id, p) => setDraft((d) => ({ ...d, stageRules: (d.stageRules || []).map((r) => (r.id === id ? { ...r, ...p } : r)) }));
  const addRule = () => setDraft((d) => ({ ...d, stageRules: [...(d.stageRules || []), { id: uid('r'), t: [], n: [], m: [], stage: '新分期' }] }));
  const removeRule = (id) => setDraft((d) => ({ ...d, stageRules: (d.stageRules || []).filter((r) => r.id !== id) }));

  const updateMapping = (id, p) => setDraft((d) => ({ ...d, categoryMapping: (d.categoryMapping || []).map((m) => (m.id === id ? { ...m, ...p } : m)) }));
  const addMapping = () => setDraft((d) => ({ ...d, categoryMapping: [...(d.categoryMapping || []), { id: uid('c'), min: 0, max: 0, category: '新分级', desc: '', advice: '' }] }));
  const removeMapping = (id) => setDraft((d) => ({ ...d, categoryMapping: (d.categoryMapping || []).filter((m) => m.id !== id) }));

  const selectedField = draft.fields.find((f) => f.id === selectedId) || null;

  return (
    <div className="flex h-full flex-col overflow-hidden">
      {/* top bar */}
      <header className="z-20 flex h-14 shrink-0 items-center gap-3 border-b border-line bg-ink-950/80 px-4 backdrop-blur">
        <div className="flex items-center gap-2.5">
          <div className="grid h-8 w-8 place-items-center rounded-lg bg-brand text-white shadow-[0_6px_18px_-6px_rgba(46,120,255,0.7)]"><Icon name="layout-template" className="h-4 w-4" /></div>
          <div className="leading-tight">
            <div className="text-sm font-semibold text-txt-hi">Template Builder</div>
            <div className="text-[10px] text-txt-low">结构化影像报告模板设计器</div>
          </div>
          <span className="ml-1 rounded-md border border-brand/30 bg-brand-soft px-1.5 py-0.5 text-[10px] font-medium text-brand">Health View OS</span>
        </div>

        <div className="mx-1 h-6 w-px bg-line" />

        <div className="flex items-center gap-1 rounded-xl border border-line bg-ink-900 p-1">
          {Object.values(PRESETS).map((p) => (
            <button key={p.id} type="button" onClick={() => switchTemplate(p.id)}
              className={cx('rounded-lg px-3 py-1.5 text-xs font-medium transition', draft.id === p.id ? 'bg-ink-700 text-white shadow-inner' : 'text-txt-mid hover:text-txt-hi')}>
              {p.name}
            </button>
          ))}
        </div>

        <div className="ml-auto flex items-center gap-2">
          <div className="hidden items-center gap-1.5 text-[11px] text-txt-low lg:flex">
            <span className="h-1.5 w-1.5 rounded-full bg-ok" />已自动保存 · {new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
          </div>
          <div className="flex rounded-lg border border-line bg-ink-900 p-0.5">
            <button type="button" onClick={() => setMode('design')} className={cx('rounded-md px-3 py-1.5 text-xs font-medium transition', mode === 'design' ? 'bg-ink-700 text-white' : 'text-txt-mid hover:text-txt-hi')}>设计器</button>
            <button type="button" onClick={() => setMode('fill')} className={cx('rounded-md px-3 py-1.5 text-xs font-medium transition', mode === 'fill' ? 'bg-ink-700 text-white' : 'text-txt-mid hover:text-txt-hi')}>医生填报</button>
          </div>
          <button type="button" onClick={() => setExportOpen(true)}
            className="flex items-center gap-1.5 rounded-lg bg-brand px-3 py-2 text-xs font-semibold text-white shadow-[0_0_0_1px_rgba(46,120,255,0.4),0_8px_20px_-8px_rgba(46,120,255,0.6)] transition hover:bg-brand/90">
            <Icon name="file-json" className="h-4 w-4" />导出 Schema
          </button>

          <div className="flex items-center rounded-lg border border-line bg-ink-900 p-0.5" role="group" aria-label="主题切换">
            <button type="button" onClick={() => setTheme('light')} title="白昼模式"
              className={cx('flex items-center gap-1.5 rounded-md px-3 py-2 text-xs font-medium transition', theme === 'light' ? 'bg-ink-700 text-white shadow-inner' : 'text-txt-mid hover:text-txt-hi')}>
              <Icon name="sun" className="h-3.5 w-3.5" />白昼
            </button>
            <button type="button" onClick={() => setTheme('dark')} title="暗夜模式"
              className={cx('flex items-center gap-1.5 rounded-md px-3 py-2 text-xs font-medium transition', theme === 'dark' ? 'bg-ink-700 text-white shadow-inner' : 'text-txt-mid hover:text-txt-hi')}>
              <Icon name="moon" className="h-3.5 w-3.5" />暗夜
            </button>
          </div>
        </div>
      </header>

      {mode === 'fill' ? (
        <FillMode key={draft.id} draft={draft} onBack={() => setMode('design')} />
      ) : (
        <div className="flex min-h-0 flex-1">
          <LibraryPanel
            draft={draft}
            selectedId={selectedId}
            onAdd={(type) => addField(type, activeGroup || draft.groups[0].id)}
            onModule={(id) => applyModule(id, activeGroup || draft.groups[0].id)}
            onSelectOutline={(id) => selectField(id)} />

          {/* center canvas */}
          <main className="flex min-w-0 flex-1 flex-col">
            <div className="flex items-center gap-2 border-b border-line bg-ink-900/40 px-5 py-2.5">
              <div className="flex items-center gap-2 text-xs text-txt-low">
                <Icon name="layers" className="h-3.5 w-3.5" />结构画布
                <span className="text-txt-low/60">/</span>
                <span className="text-txt-mid">{draft.name}</span>
                <span className="rounded bg-ink-800 px-1.5 py-0.5 font-mono text-[10px] text-txt-low">{draft.version}</span>
              </div>
              <div className="ml-auto flex items-center gap-2">
                <span className="flex items-center gap-1.5 text-[11px] text-txt-low"><Icon name="grip-vertical" className="h-3.5 w-3.5" />拖拽排序 / 从左侧拖入新组件</span>
              </div>
            </div>

            <div className="min-h-0 flex-1 overflow-y-auto px-6 py-5">
              <div className="mx-auto max-w-[1060px] space-y-4">
                {draft.groups.map((g) => {
                  const fields = draft.fields.filter((f) => f.groupId === g.id);
                  return (
                    <div key={g.id}
                      onClick={() => setActiveGroup(g.id)}
                      onDragOver={(e) => { e.preventDefault(); setOver(g.id); }}
                      onDragLeave={() => setOver((o) => (o === g.id ? null : o))}
                      onDrop={(e) => {
                        e.preventDefault(); setOver(null); setDragging(null);
                        try {
                          const p = JSON.parse(e.dataTransfer.getData('text/plain'));
                          if (p.kind === 'type') { addField(p.type, g.id); }
                          else if (p.kind === 'module') { applyModule(p.id, g.id); }
                          else if (p.kind === 'field') { moveField(p.id, null, g.id); }
                        } catch (err) {}
                      }}
                      className={cx('rounded-2xl border bg-ink-900/60 transition', activeGroup === g.id ? 'border-brand/50 ring-1 ring-brand/15' : 'border-line', over === g.id && 'border-brand bg-brand-soft/20')}>
                      <div className="flex items-center gap-2 border-b border-line/60 px-4 py-3">
                        <Icon name={g.icon} className="h-4 w-4 text-brand" />
                        <h3 className="text-sm font-semibold text-txt-hi">{g.title}</h3>
                        <span className="rounded bg-ink-850 px-1.5 py-0.5 text-[10px] text-txt-low">{fields.length} 字段</span>
                        <span className="ml-auto rounded border border-line bg-ink-900 px-2 py-1 text-[10px] text-txt-low">默认添加目标</span>
                        <button type="button"
                          onClick={(e) => { e.stopPropagation(); addField('radio', g.id); }}
                          className="rounded-md border border-line bg-ink-900 p-1.5 text-txt-low hover:border-brand/40 hover:text-txt-hi">
                          <Icon name="plus" className="h-3.5 w-3.5" />
                        </button>
                      </div>
                      <div className="space-y-2.5 p-3">
                        {fields.length === 0 ? (
                          <div className="rounded-xl border border-dashed border-line p-6 text-center text-xs text-txt-low">从左侧拖入组件，或单击组件库项目添加</div>
                        ) : fields.map((f) => (
                          <FieldBlock
                            key={f.id}
                            field={f}
                            draft={draft}
                            designVals={designVals}
                            designCtx={designCtx}
                            selected={selectedId === f.id}
                            isOver={dragging === f.id}
                            onClick={() => selectField(f.id, g.id)}
                            onDelete={removeField}
                            onValueChange={setFieldValue}
                            onDragStart={(e) => {
                              e.stopPropagation();
                              e.dataTransfer.setData('text/plain', JSON.stringify({ kind: 'field', id: f.id }));
                              e.dataTransfer.effectAllowed = 'move';
                              setDragging(f.id);
                            }}
                            onDragOver={(e) => { e.preventDefault(); setOver(f.id); }}
                            onDrop={(e) => {
                              e.preventDefault(); setOver(null);
                              try {
                                const p = JSON.parse(e.dataTransfer.getData('text/plain'));
                                if (p.kind === 'field') { moveField(p.id, f.id, null); }
                                else if (p.kind === 'type') { addField(p.type, f.groupId, f.id); }
                                else if (p.kind === 'module') { applyModule(p.id, f.groupId); }
                              } catch (err) {}
                              setDragging(null);
                            }}
                          />
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* live report strip */}
            <div className="shrink-0 border-t border-line bg-ink-950/70">
              <div className="mx-auto max-w-[1060px] px-5 py-3">
                <div className="mb-2 flex items-center gap-2">
                  <Icon name="sparkles" className="h-4 w-4 text-brand" />
                  <span className="text-xs font-semibold text-txt-hi">报告文本实时预览</span>
                  <span className="text-[10px] text-txt-low">基于当前模板默认值生成</span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="min-h-[64px] rounded-lg border border-line bg-ink-900/70 p-3">
                    <div className="text-[10px] uppercase tracking-wider text-txt-low">Findings</div>
                    <p className="mt-1 whitespace-pre-line text-xs leading-relaxed text-txt-mid">{designFindings || '（暂无输出）'}</p>
                  </div>
                  <div className="min-h-[64px] rounded-lg border border-brand-line bg-brand-soft/20 p-3">
                    <div className="text-[10px] uppercase tracking-wider text-txt-low">Conclusion</div>
                    <p className="mt-1 text-xs leading-relaxed text-txt-hi">{designConclusion || '（暂无输出）'}</p>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* right inspector */}
          <aside className="flex w-[380px] shrink-0 flex-col border-l border-line bg-ink-900/60">
            <div className="border-b border-line px-3 pt-3">
              <div className="flex gap-1">
                {[['field', '字段属性'], ['rules', '规则引擎'], ['report', '报告文本'], ['settings', '模板设置']].map(([k, label]) => (
                  <button key={k} type="button" onClick={() => setRightTab(k)}
                    className={cx('rounded-t-lg px-3 py-2 text-xs font-medium transition', rightTab === k ? 'border border-line border-b-ink-900 bg-ink-900 text-white' : 'text-txt-mid hover:text-txt-hi')}>
                    {label}
                  </button>
                ))}
              </div>
            </div>
            <div className="min-h-0 flex-1 overflow-y-auto">
              {rightTab === 'field' && <FieldInspector draft={draft} field={selectedField} updateField={updateField} removeField={removeField} goRules={() => setRightTab('rules')} />}
              {rightTab === 'rules' && (draft.kind === 'TNM'
                ? <StageRulesPanel draft={draft} patch={patch} updateRule={updateRule} addRule={addRule} removeRule={removeRule} />
                : <CategoryMappingPanel draft={draft} patch={patch} updateMapping={updateMapping} addMapping={addMapping} removeMapping={removeMapping} />)}
              {rightTab === 'report' && <ReportTextTab draft={draft} patch={patch} />}
              {rightTab === 'settings' && <TemplateSettingsTab draft={draft} patch={patch} onReset={() => { setDraft(clone(PRESETS[draft.id])); setSelectedId(null); showToast('已恢复预置数据'); }} />}
            </div>
          </aside>
        </div>
      )}

      {exportOpen ? <ExportModal draft={draft} onClose={() => setExportOpen(false)} /> : null}
      {toast ? (
        <div className="fixed left-1/2 top-16 z-[60] -translate-x-1/2 rounded-lg border border-line bg-ink-800 px-4 py-2 text-xs font-medium text-txt-hi shadow-2xl">
          {toast}
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
